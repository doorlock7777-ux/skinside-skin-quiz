[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin-answkdrnschkfdudth/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/partner-k3x9m2/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/pay/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/"
  to = "/quiz/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/store"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/quiz"
  to = "/"
  status = 301

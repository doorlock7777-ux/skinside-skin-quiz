[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Cache-Control = "no-store"

[[headers]]
  for = "/pay/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/"
  to = "/quiz/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/store"
  to = "/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/quiz"
  to = "/"
  status = 301

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>관리자</title>
<style>
:root{--pri:#4E57A2;--pri-soft:#eceef8;--ink:#191f28;--mute:#6b7684;--line:#e5e8eb;--bg:#f2f4f6;--card:#fff;--red:#f04452;--ok:#12b886}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--pri);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:17px;flex:1;min-width:120px}
header a{color:#fff;font-weight:700;text-decoration:none;opacity:.9}
nav{display:flex;gap:6px;max-width:980px;margin:0 auto;padding:14px 16px 0}
nav button{flex:none;font:inherit;font-weight:700;border:0;background:transparent;color:var(--mute);padding:10px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chips button{font:inherit;font-weight:600;border:0;background:var(--card);color:#4e5968;padding:8px 14px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border-radius:16px;padding:16px}
.kpi small{display:block;color:var(--mute);font-size:12.5px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bars li:first-child{border-top:0}
.bars .rk{font-weight:800;color:var(--pri);text-align:center}
.bars .nm{min-width:0}
.bars .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .nm span{color:var(--mute);font-size:12px}
.bars .tr{height:6px;border-radius:99px;background:var(--pri-soft);margin-top:5px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bars .n{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.bars .n small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tp{display:grid;grid-template-columns:70px minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.tp code{font-weight:800;letter-spacing:.03em}
.tp .tr{height:8px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.tp .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.tp span{text-align:right;color:var(--mute);font-size:13px;white-space:nowrap}
.ax{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ax h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.seg{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--pri-soft);margin-bottom:6px}
.seg i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;font-style:normal;white-space:nowrap;overflow:hidden}
.c0{background:#4E57A2}.c1{background:#7a84d1}.c2{background:#aab1e6;color:#2a3070!important}
.more{font:inherit;font-weight:700;color:var(--pri);background:var(--pri-soft);border:0;border-radius:10px;padding:9px 14px;margin-top:8px;cursor:pointer}
.kc{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.kc img{width:56px;height:56px;border-radius:34%;object-fit:cover;flex:none}
.kc .kn{font-size:18px;font-weight:800;display:flex;gap:6px;align-items:center}
.kc .kf{color:var(--mute)}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid #d1d6db;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pri{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;margin-top:18px}
button.pri:disabled{opacity:.5}
button.sm{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;width:auto;margin:0}
button.del{font:inherit;font-weight:700;border:1px solid var(--red);background:#fff;color:var(--red);padding:7px 12px;border-radius:9px;cursor:pointer}
.drop{display:flex;gap:14px;align-items:center;border:1.5px dashed #c4c9d0;border-radius:14px;padding:14px;background:#fafbfc}
.drop .pv{width:84px;height:84px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;flex:none}
.pvh{display:none}
.msg{margin-top:12px;font-weight:700}.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl img{width:52px;height:52px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.pl div{flex:1;min-width:0}.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{color:var(--mute)}
.empty{color:var(--mute);padding:14px 0;text-align:center}
#lg{max-width:360px;margin:70px auto;padding:0 20px;text-align:center}
.demo{background:#fff8e6;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}

header button{font:inherit;font-weight:700;border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:9px;cursor:pointer}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.todo{border-radius:16px;padding:16px 18px;margin-bottom:12px;background:#fff4e6;color:#8a4b00}
.todo.ok{background:#e3f8f0;color:#0b7a5a}
.todo b{display:block;font-size:15px;margin-bottom:6px}
.todo a{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:6px 12px;margin:4px 6px 0 0;font-weight:700;color:#8a4b00;text-decoration:none;cursor:pointer}
.todo a i{font-style:normal;background:#f04452;color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:0 6px;font-size:12px}
.kpi small em{font-style:normal;font-weight:700}.up{color:var(--ok)}.dn{color:var(--red)}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--pri-soft);margin:6px 0 10px}
.flow i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:12.5px;min-width:0;overflow:hidden}
.f0{background:#f59f00}.f1{background:#4E57A2}.f2{background:#12b886}.f3{background:#adb5bd}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:13px}.leg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.go{float:right;font-size:13px;font-weight:700;color:var(--pri);text-decoration:none;cursor:pointer}
.bt{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bt:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.dot.w{background:#f59f00}.dot.r{background:var(--red)}.dot.g{background:#ced4da}
.bt span{color:var(--mute);font-size:12.5px;text-align:right;white-space:nowrap}.bt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri)}.tag.w{background:#fff4e6;color:#8a4b00}.tag.r{background:#fde8ea;color:var(--red)}
.o2{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.o2 .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
.o2 .br{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.o2 .br>div:first-child{flex:1;min-width:230px}
.o2 select,.o2 input{width:auto;padding:8px 10px}
.s{color:var(--mute);font-size:13px}.okc{color:var(--ok);font-weight:700}.wn{color:var(--red);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}.tbl th{color:var(--mute);font-weight:600;font-size:12.5px}.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.08em;word-break:break-all}
.newc{background:#eceef8;border-radius:14px;padding:16px;margin-bottom:12px}
button.g{font:inherit;font-weight:700;border:1px solid var(--pri);background:#fff;color:var(--pri);padding:8px 12px;border-radius:9px;cursor:pointer}
button.g:disabled{opacity:.5}
.lgp{max-width:380px;margin:60px auto;padding:0 20px}.lgp h2{text-align:center;margin:0 0 4px}
textarea{font:inherit;padding:10px;border:1px solid var(--line,#e5e8eb);border-radius:10px;background:var(--card,#fff);color:var(--ink,#191f28)}
/* ===== 스킨인사이드 운영 화면 테마: 터미널형 대시보드 (다크 전용, 스킨인사이드 인디고) ===== */
:root{--pri:#4E57A2;--pri-soft:#1a1e38;--ink:#eceef8;--mute:#8b91ab;--line:#252840;--bg:#0a0b11;--card:#10121b;--card2:#151827;--red:#ff6577;--ok:#35f0b0;--warn:#ffb54a;--warn-bg:#2a2010;--neon:#7882dc;--neon-glow:none;--glow:0 0 0 1px var(--neon);--hd:#0a0b11;--ok-bg:#0d2a22;--red-bg:#33121a;--inp:#0b0c14;color-scheme:dark;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;}
body{background:var(--bg);color:var(--ink);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
/* 머리글 */
header{background:var(--hd)!important;color:var(--ink)!important;border-bottom:1px solid var(--line);padding:13px max(16px,env(safe-area-inset-left,0px))!important;gap:12px}
header b{display:flex!important;align-items:center;gap:10px;font-size:15px!important;font-weight:800;letter-spacing:.01em}
header b:before{content:"S";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--neon);color:#fff;font-family:var(--mono);font-weight:800;box-shadow:var(--neon-glow)}
header span{color:var(--mute)!important;font-size:12px!important;opacity:1!important}
header button{border:1px solid var(--line)!important;background:transparent!important;color:var(--ink)!important;border-radius:8px!important;padding:7px 12px!important;font-size:13px}
header button:hover{border-color:var(--neon)!important;box-shadow:var(--glow)}
/* 탭 */
nav,#tb .tabs{border-bottom:1px solid var(--line);max-width:none!important;margin:0!important;padding:0 max(16px,env(safe-area-inset-left,0px))!important;gap:2px!important;background:var(--hd);overflow-x:auto;scrollbar-width:none}
nav button,#tb .tabs button{border-radius:0!important;background:transparent!important;color:var(--mute)!important;padding:13px 16px!important;border-bottom:2px solid transparent!important;font-weight:700;white-space:nowrap}
nav button:hover,#tb .tabs button:hover{color:var(--ink)!important}
nav button.on,#tb .tabs button.on{color:var(--neon)!important;border-bottom-color:var(--neon)!important;text-shadow:var(--neon-glow)}
#tb .tabs{display:flex;margin-bottom:0!important}
main{max-width:1040px!important}
/* 카드: 얇은 테두리, 작은 모서리 */
.card,.o,.o2,.kpi div,.big,.lgp,.tk{border:1px solid var(--line);border-radius:10px!important;background:var(--card)}
.card h2,.lgp h2{font-size:15px!important;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--neon);box-shadow:var(--neon-glow)}
.lgp h2:before{display:none}
.sub,.s{color:var(--mute)}
.go{color:var(--neon)!important;text-shadow:var(--neon-glow);font-family:var(--mono);font-size:12px!important}
/* 핵심 지표: 칸으로 이어 붙인 표 */
.kpi{gap:0!important;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px!important}
.kpi div{border:0!important;border-radius:0!important;background:var(--card)!important;padding:14px 16px!important}
.kpi small{font-size:11.5px!important;letter-spacing:.04em;color:var(--mute)}
.kpi b{font-family:var(--mono);font-size:24px!important;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-shadow:var(--glow)}
.kpi b{text-shadow:none}
.up{color:var(--ok)!important;font-family:var(--mono)}.dn{color:var(--red)!important;font-family:var(--mono)}
/* 처리할 일 / 안내 */
.todo{border:1px solid var(--warn);background:var(--warn-bg)!important;color:var(--warn)!important;border-radius:10px!important}
.todo.ok{border-color:var(--ok);background:var(--ok-bg)!important;color:var(--ok)!important;box-shadow:var(--glow)}
.todo a{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:8px!important}
.todo a:hover{border-color:var(--neon);box-shadow:var(--glow)}
.todo a i{background:var(--red)!important;color:#fff;font-family:var(--mono)}
.note,.help{background:var(--warn-bg)!important;color:var(--warn)!important;border:1px solid var(--line);border-radius:10px!important}
.big{background:var(--card)!important;color:var(--ink)!important;border-color:var(--neon);box-shadow:var(--glow);position:relative}
.big b{font-family:var(--mono);color:var(--neon);text-shadow:var(--neon-glow)}
.big small,.big a{color:var(--mute)!important}.big a{color:var(--neon)!important;text-shadow:var(--neon-glow)}
.big.late{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}.big.late b{color:var(--red);text-shadow:none}
.big.zero{border-color:var(--ok)}.big.zero b{color:var(--ok)}
/* 흐름 막대, 점, 태그 */
.flow,.seg,.bars .tr,.tp .tr{background:var(--pri-soft)!important;border-radius:6px!important}
.f1,.c0{background:var(--pri)!important;box-shadow:var(--glow)}.f2{background:#0aa774!important}.f3{background:#7a8099!important}
.bars .tr i,.tp .tr i{background:var(--neon)!important;box-shadow:var(--neon-glow)}
.bars .rk,.tp code,.code{font-family:var(--mono);color:var(--neon)!important}
.code{text-shadow:var(--neon-glow)}
.dot{background:var(--ok)!important;box-shadow:none}.dot.w{background:var(--warn)!important;box-shadow:none}.dot.r{background:var(--red)!important;box-shadow:none}.dot.g{background:var(--mute)!important;box-shadow:none}
.tag,.st{background:var(--pri-soft)!important;color:var(--neon)!important;border:1px solid var(--line);border-radius:6px!important;font-family:var(--mono);font-size:11.5px!important}
.tag.w{background:var(--warn-bg)!important;color:var(--warn)!important}.tag.r,.st.c{background:var(--red-bg)!important;color:var(--red)!important}.st.d{background:var(--ok-bg)!important;color:var(--ok)!important}
.okc{color:var(--ok)!important}.wn{color:var(--red)!important}
/* 표 */
.tbl th,.rw .s,.tbl td{border-color:var(--line)!important}.tbl th{font-size:11.5px!important;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.tbl td.r,.tbl th.r,.rw b,.wk b,.bt span,.bars .n,.tp span{font-family:var(--mono)}
.bt,.rw,.bars li,.pl,.o2 .br,.ax,.tk{border-color:var(--line)!important}
/* 입력과 버튼 */
input,select,textarea{background:var(--inp)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--neon)!important;box-shadow:var(--glow)}
button.pri,button.sm,button.sv,.big+.x{background:var(--pri)!important;color:#fff!important;border-radius:8px!important}
button.pri:hover,button.sm:hover,button.sv:hover{box-shadow:var(--glow);filter:brightness(1.08)}
button.g,.bt2,button.del,.more,.chips button,a.dl{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}
button.g,.bt2:not(.red),.more{color:var(--neon)!important}
a.dl{background:var(--pri)!important;color:#fff!important;border-color:transparent!important}
button.del,.bt2.red{color:var(--red)!important;border-color:var(--red)!important}
button.g:hover,.bt2:hover,.chips button:hover,.more:hover{border-color:var(--neon)!important;box-shadow:var(--glow)}
.chips button.on{background:var(--pri-soft)!important;color:var(--neon)!important;border-color:var(--neon)!important;box-shadow:var(--glow);text-shadow:var(--neon-glow)}
.drop{background:var(--card2)!important;border-color:var(--line)!important;border-radius:10px!important}
.drop .pv,.pl img{background:var(--card2)!important;border-color:var(--line)!important}
.newc{background:var(--pri-soft)!important;border:1px solid var(--neon);box-shadow:var(--glow);border-radius:10px!important}
.it,.ms{background:var(--card2)!important;border:1px solid var(--line);border-radius:8px!important}.ms.p{background:var(--pri-soft)!important}
.al{background:var(--red-bg)!important;color:var(--red)!important;border-radius:6px!important}
.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.wk i{background:var(--neon)!important;box-shadow:var(--neon-glow);border-radius:4px 4px 0 0!important}.wk b{color:var(--ink)}
.empty{color:var(--mute)}
.demo{background:var(--warn-bg)!important;color:var(--warn)!important}
/* 라벨(작은 대문자 느낌) */
label{font-size:12px!important;letter-spacing:.03em;color:var(--mute)}
</style></head>
<body>
<div id="dm" class="demo" hidden></div>

var A = document.getElementById("app"), tab = "home", days = 7, CATS = {}, EXTRA = [];
var TABS = [["home", "홈"], ["orders", "주문"], ["brands", "브랜드"], ["cs", "CS"], ["settle", "정산"], ["add", "제품"], ["stats", "통계"]];
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ return Number(v || 0).toLocaleString("ko-KR"); }
function kst(iso){ var d = new Date(new Date(iso).getTime() + 9 * 36e5); return d.toISOString().slice(5, 16).replace("T", " "); }
function ago(iso){ if(!iso) return "없음"; var h = Math.floor((Date.now() - new Date(iso).getTime()) / 36e5); return h < 1 ? "방금" : h < 24 ? h + "시간 전" : Math.floor(h / 24) + "일 전"; }
function api(p, o){ o = o || {}; o.credentials = "same-origin"; return fetch(p, o).then(function(r){ if(r.status === 401){ login(true); throw new Error("auth"); } return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); return j; }); }); }
function post(p, b){ return api(p, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(b)}); }
var M = function(){ return document.getElementById("mn"); };
function fail(e){ if(e && e.message !== "auth" && M()) M().innerHTML = '<div class="card"><div class="empty">' + esc(e.message || "불러오지 못했어요") + '</div></div>'; }

/* ---------- 로그인: 아이디 + 비밀번호 + 2차 비밀번호 ---------- */
function boot(){
  fetch("/api/admin/me", {credentials:"same-origin"}).then(function(r){ if(!r.ok) return login(false); return fetch("/data/products.json").then(function(x){ return x.json(); }).then(function(j){ CATS = j.categories || {}; }).catch(function(){}).then(show); }).catch(function(){ login(false); });
}
function login(bad){
  A.innerHTML = '<div class="lgp card"><h2>관리자 로그인</h2><p class="sub" style="text-align:center">' + (bad ? '다시 로그인해주세요.' : '아이디와 비밀번호 두 개를 모두 입력해주세요.') + '</p>'
    + '<label>아이디</label><input id="li" autocomplete="username" autocapitalize="none" spellcheck="false">'
    + '<label>비밀번호</label><input id="lp" type="password" autocomplete="current-password">'
    + '<label>2차 비밀번호</label><input id="l2" type="password" autocomplete="off" inputmode="numeric">'
    + '<button class="pri" id="lgo">로그인</button><div class="msg e" id="lm"></div></div>';
  var go = function(){ var b = document.getElementById("lgo"), m = document.getElementById("lm"); b.disabled = true; m.textContent = "";
    fetch("/api/admin/login", {method:"POST", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify({id:document.getElementById("li").value.trim(), pw:document.getElementById("lp").value, pw2:document.getElementById("l2").value})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); }); }).then(boot).catch(function(e){ b.disabled = false; m.textContent = e.message; document.getElementById("lp").value = ""; document.getElementById("l2").value = ""; }); };
  document.getElementById("lgo").onclick = go;
  [].forEach.call(A.querySelectorAll("input"), function(i){ i.onkeydown = function(e){ if(e.key === "Enter") go(); }; });
}

function show(){
  A.innerHTML = '<header><b>SKININSIDE <span style="font-weight:600">ADMIN</span></b><button id="lo">로그아웃</button></header><nav>' + TABS.map(function(t){ return '<button data-t="' + t[0] + '" class="' + (t[0] === tab ? "on" : "") + '">' + t[1] + '</button>'; }).join("") + '</nav><main id="mn"></main>';
  [].forEach.call(A.querySelectorAll("nav button"), function(b){ b.onclick = function(){ go(b.dataset.t); }; });
  document.getElementById("lo").onclick = function(){ fetch("/api/admin/logout", {method:"POST", credentials:"same-origin"}).then(function(){ login(false); }); };
  ({home:home, cs:cs, orders:orders, brands:brands, settle:settle, add:add, stats:dash})[tab]();
}
function go(t){ tab = t; try{ history.replaceState(null, "", "#" + t); }catch(e){} show(); window.scrollTo(0, 0); }
function fromHash(){ var h = (location.hash || "").slice(1); if(TABS.some(function(t){ return t[0] === h; })) tab = h; }
fromHash();
window.addEventListener("hashchange", function(){ if(document.querySelector("nav")){ fromHash(); show(); } });
function links(root){ [].forEach.call(root.querySelectorAll("[data-go]"), function(a){ a.onclick = function(e){ e.preventDefault(); go(a.dataset.go); }; }); }

/* ---------- 홈: 읽기 전용 요약. 작업은 각 탭에서 ---------- */
function delta(a, b){ if(!b) return a ? '<em class="up">어제 없음</em>' : ''; var p = Math.round((a - b) / b * 100); return '<em class="' + (p >= 0 ? "up" : "dn") + '">어제보다 ' + (p >= 0 ? "▲" : "▼") + Math.abs(p) + '%</em>'; }
function home(){
  M().innerHTML = '<div class="empty">불러오는 중...</div>';
  Promise.all([api("/api/admin/home"), api("/api/manage/dashboard?days=1").catch(function(){ return null; })]).then(function(r){
    var d = r[0], s = r[1] || {events:{}, kakao:{}}, f = d.flow, tot = f.wait + f.done + f.canceled, ev = s.events || {}, k = s.kakao || {};
    var h = d.todo.length ? '<div class="todo"><b>처리할 일이 ' + d.todo.length + '가지 있어요</b>' + d.todo.map(function(t){ return '<a data-go="' + t.tab + '">' + esc(t.label) + ' <i>' + t.n + '</i></a>'; }).join("") + '</div>'
      : '<div class="todo ok"><b>지금 처리할 일이 없어요</b>모든 주문이 제때 흘러가고 있어요.</div>';
    h += '<div class="kpi"><div><small>오늘 매출 ' + delta(d.today.sales, d.today.yestSales) + '</small><b>' + n(d.today.sales) + '원</b></div><div><small>오늘 주문 ' + delta(d.today.orders, d.today.yestOrders) + '</small><b>' + n(d.today.orders) + '건</b></div><div><small>발송 전 주문</small><b>' + n(f.wait) + '건</b></div><div><small>이번 달 매출</small><b>' + n(d.month.sales) + '원</b></div></div>';
    h += '<div class="card"><a class="go" data-go="orders">주문 보기 →</a><h2>주문 흐름</h2><p class="sub">브랜드별 배송 건수 기준이에요.</p>' + (tot ? '<div class="flow">' + [[f.wait, "f1"], [f.done, "f2"], [f.canceled, "f3"]].map(function(x){ return x[0] ? '<i class="' + x[1] + '" style="width:' + (x[0] / tot * 100) + '%">' + x[0] + '</i>' : ''; }).join("") + '</div>' : '<div class="empty">아직 주문이 없어요.</div>')
      + '<div class="leg"><span style="--c:#4E57A2">발송 대기 ' + f.wait + '</span><span style="--c:#12b886">발송 완료 ' + f.done + '</span><span style="--c:#adb5bd">취소 ' + f.canceled + '</span></div></div>';
    var br = d.brands, shown = br.filter(function(b){ return b.today || b.open; }).concat(br.filter(function(b){ return !b.today && !b.open; })).slice(0, 8);
    h += '<div class="grid2"><div class="card"><a class="go" data-go="brands">브랜드 보기 →</a><h2>브랜드 현황</h2><p class="sub">오늘 주문 · 미발송 · 지연</p>' + shown.map(function(b){
      var c = b.late ? "r" : b.open ? "w" : (b.today ? "" : "g");
      return '<div class="bt"><i class="dot ' + c + '"></i><b>' + esc(b.name) + '</b><span>오늘 ' + b.today + '</span><span>미발송 ' + b.open + '</span>' + (b.late ? '<span class="tag r">지연 ' + b.late + '</span>' : !b.hasCode ? '<span class="tag w">코드 없음</span>' : '<span class="tag">정상</span>') + '</div>'; }).join("") + '</div>';
    h += '<div class="card"><a class="go" data-go="settle">정산 보기 →</a><h2>' + d.month.m.slice(5) + '월 정산</h2><p class="sub">이번 달 누적이에요.</p><div class="kpi" style="grid-template-columns:1fr 1fr;margin:0"><div style="background:var(--bg)"><small>수수료(우리 수익)</small><b style="font-size:22px">' + n(d.month.fee) + '원</b></div><div style="background:var(--bg)"><small>브랜드 정산 예정</small><b style="font-size:22px">' + n(d.month.payout) + '원</b></div></div>'
      + (d.month.rows.length ? '<div style="margin-top:8px">' + d.month.rows.slice(0, 4).map(function(x){ return '<div class="bt" style="grid-template-columns:minmax(0,1fr) auto"><b>' + esc(x.name) + '</b><span>' + n(x.sales) + '원</span></div>'; }).join("") + '</div>' : '') + '</div></div>';
    h += '<div class="card"><a class="go" data-go="stats">통계 보기 →</a><h2>오늘의 진단</h2><div class="kpi" style="margin:8px 0 0"><div style="background:var(--bg)"><small>진단 시작</small><b>' + n(ev.quiz_start) + '</b></div><div style="background:var(--bg)"><small>진단 완료</small><b>' + n(ev.quiz_done) + '</b></div><div style="background:var(--bg)"><small>채널 추가 클릭</small><b>' + n(ev.kakao_click) + '</b></div><div style="background:var(--bg)"><small>카카오 친구</small><b>' + n(k.friends) + '</b></div></div></div>';
    M().innerHTML = h; links(M());
  }).catch(fail);
}

/* ---------- 주문 ---------- */
var CAR = {cj:"CJ대한통운", lotte:"롯데택배", hanjin:"한진택배", post:"우체국", logen:"로젠택배"}, STL = {paid:"결제 완료", partial:"일부 발송", shipped:"발송 완료", canceled:"취소됨", failed:"결제 실패"}, OF = "all";
function orders(){
  M().innerHTML = '<div class="empty">불러오는 중...</div>';
  api("/api/admin/orders").then(function(j){
    var all = j.orders, list = all.filter(function(o){ return OF === "all" ? true : OF === "todo" ? ["paid", "partial"].indexOf(o.status) >= 0 : OF === "done" ? o.status === "shipped" : o.status === "canceled"; });
    var cnt = {all:all.length, todo:all.filter(function(o){ return ["paid", "partial"].indexOf(o.status) >= 0; }).length, done:all.filter(function(o){ return o.status === "shipped"; }).length, cx:all.filter(function(o){ return o.status === "canceled"; }).length};
    var h = '<div class="chips" id="of">' + [["all", "전체"], ["todo", "발송 전"], ["done", "발송 완료"], ["cx", "취소"]].map(function(x){ return '<button data-f="' + x[0] + '" class="' + (OF === x[0] ? "on" : "") + '">' + x[1] + ' ' + cnt[x[0]] + '</button>'; }).join("") + '</div>';
    h += '<div class="card note"><small>송장번호는 브랜드가 파트너 페이지에서 직접(또는 엑셀로) 입력하면 여기에 자동 반영돼요. 아래 입력칸은 브랜드가 대신 알려줄 때만 쓰세요.</small></div>';
    h += list.length ? list.map(function(o){
      var a = o.ship || {}, by = {};
      o.items.forEach(function(l){ (by[l.brand] = by[l.brand] || []).push(l); });
      var s = '<div class="o2"><div class="h"><span>' + esc(o.id) + ' · ' + kst(o.createdAt) + '</span><span class="tag ' + (o.status === "canceled" ? "r" : "") + '">' + (STL[o.status] || esc(o.status)) + ' · ' + n(o.total) + '원</span></div><div class="s">' + esc(a.name) + ' / ' + esc(a.phone) + ' / (' + esc(a.zip) + ') ' + esc(a.addr1) + ' ' + esc(a.addr2) + (a.memo ? ' / 메모: ' + esc(a.memo) : '') + '</div>';
      Object.keys(by).forEach(function(k){
        var sh = (o.shipments || {})[k] || {}, nm = (j.brands[k] && j.brands[k].name) || k, sd = (o.sent || {})[k], key = esc(o.id + "|" + k);
        s += '<div class="br"><div><b>' + esc(nm) + '</b> <span class="' + (sd ? 'okc' : 's') + '">' + (sd ? '브랜드에 즉시 알림 ' + kst(sd) : '알림 대기') + '</span><div class="s">' + by[k].map(function(l){ return esc(l.name) + (l.optName ? ' (' + esc(l.optName) + ')' : '') + ' x' + l.q; }).join('<br>') + '</div></div>'
          + '<select data-c="' + key + '">' + Object.keys(CAR).map(function(c){ return '<option value="' + c + '"' + (sh.carrier === c ? ' selected' : '') + '>' + CAR[c] + '</option>'; }).join("") + '</select><input data-t="' + key + '" placeholder="송장번호" value="' + esc(sh.tracking || "") + '"><button class="sm" data-s="' + key + '">저장</button></div>';
      });
      if(["paid", "partial", "shipped"].indexOf(o.status) >= 0) s += '<div style="margin-top:8px"><button class="del" data-x="' + esc(o.id) + '">결제 취소·환불</button></div>';
      return s + '</div>';
    }).join("") : '<div class="card"><div class="empty">해당하는 주문이 없어요.</div></div>';
    M().innerHTML = h;
    [].forEach.call(M().querySelectorAll("#of button"), function(b){ b.onclick = function(){ OF = b.dataset.f; orders(); }; });

    + '<label>제품명</label><input id="fn" maxlength="80" placeholder="예: 시카 진정 앰플">'
    + '<label>브랜드명</label><input id="fb" maxlength="40" placeholder="예: LIVNA">'
    + '<div class="two"><div><label>정가 (원)</label><input id="fl" type="number" inputmode="numeric" min="0" placeholder="34000"></div><div><label>할인가 (원)</label><input id="fp" type="number" inputmode="numeric" min="0" placeholder="26900"></div></div><div class="sub" id="fd" style="margin:6px 0 0"></div>'
    + '<label>카테고리</label><select id="fc">' + opts + '</select>'
    + '<label>바로가기 링크</label><input id="fu" type="url" placeholder="https://">'
    + '<button class="pri" id="fs">제품 등록</button><div class="msg" id="fm"></div></div>'
    + '<div class="card"><h2>추가한 제품</h2><div id="pl"><div class="empty">불러오는 중...</div></div></div>';
  var $ = function(i){ return document.getElementById(i); };
  function disc(){ var l = +$("fl").value, p = +$("fp").value; $("fd").textContent = l > 0 && p > 0 ? (p > l ? "할인가가 정가보다 커요" : p < l ? Math.round((l - p) / l * 100) + "% 할인" : "할인 없음") : ""; }
  $("fl").oninput = disc; $("fp").oninput = disc;
  $("fi").onchange = function(){ var f = this.files[0]; if(!f) return; shrink(f).then(function(u){ IMG = u; $("pv").src = u; }).catch(function(){ IMG = ""; msg("이미지를 읽지 못했어요", 1); }); };
  function msg(t, e){ var m = $("fm"); m.className = "msg " + (e ? "e" : "o"); m.textContent = t; }
  $("fs").onclick = function(){
    var b = this; if(!IMG) return msg("이미지를 선택해주세요", 1);
    b.disabled = true; msg("등록 중...");
    post("/api/manage/product", {img:IMG, name:$("fn").value, brandName:$("fb").value, list:$("fl").value, price:$("fp").value, cat:$("fc").value, url:$("fu").value}).then(function(){ msg("등록했어요. 스토어에 바로 반영돼요."); ["fn", "fb", "fl", "fp", "fu"].forEach(function(i){ $(i).value = ""; }); $("fi").value = ""; $("pv").src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="; IMG = ""; disc(); list(); }).catch(function(e){ if(e.message !== "auth") msg(e.message, 1); }).then(function(){ b.disabled = false; });
  };
  list();
}
function list(){
  api("/api/manage/products").then(function(j){
    var el = document.getElementById("pl"); if(!el) return; EXTRA = j.products || [];
    el.innerHTML = EXTRA.length ? EXTRA.map(function(p){ return '<div class="pl"><img src="' + esc(p.img) + '" alt=""><div><b>' + esc(p.name) + '</b><small>' + esc(p.brandName) + ' · ' + esc(CATS[p.cat] || p.cat) + ' · ' + n(p.price) + '원' + (p.list ? ' (정가 ' + n(p.list) + '원)' : '') + '</small></div><button class="del" data-id="' + esc(p.id) + '">삭제</button></div>'; }).join("") : '<div class="empty">추가한 제품이 없어요.</div>';
    [].forEach.call(el.querySelectorAll(".del"), function(b){ b.onclick = function(){ if(b.dataset.s !== "1"){ b.dataset.s = "1"; b.textContent = "한 번 더 눌러 삭제"; return; } post("/api/manage/product-delete", {id:b.dataset.id}).then(list).catch(function(){}); }; });
  }).catch(function(){});
}
/* 이미지를 800px, webp로 줄여 올린다 */
function shrink(f){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(f), im = new Image();
    im.onload = function(){ var s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); var o = c.toDataURL("image/webp", 0.85); if(o.indexOf("data:image/webp") !== 0) o = c.toDataURL("image/jpeg", 0.88); res(o); };
    im.onerror = function(){ rej(); }; im.src = u;
  });
}
boot();
</script>

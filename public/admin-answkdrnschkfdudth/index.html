<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>관리자</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--pri:#4E57A2;--pri-soft:#eceef8;--ink:#191f28;--mute:#6b7684;--line:#e5e8eb;--bg:#f2f4f6;--card:#fff;--red:#f04452;--ok:#12b886}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--pri);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:17px;flex:1;min-width:120px}
header a{color:#fff;font-weight:700;text-decoration:none;opacity:.9}
nav{display:flex;gap:6px;max-width:980px;margin:0 auto;padding:14px 16px 0}
nav button{flex:none;font:inherit;font-weight:700;border:0;background:transparent;color:var(--mute);padding:10px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chips button{font:inherit;font-weight:600;border:0;background:var(--card);color:#4e5968;padding:8px 14px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border-radius:16px;padding:16px}
.kpi small{display:block;color:var(--mute);font-size:12.5px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bars li:first-child{border-top:0}
.bars .rk{font-weight:800;color:var(--pri);text-align:center}
.bars .nm{min-width:0}
.bars .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .nm span{color:var(--mute);font-size:12px}
.bars .tr{height:6px;border-radius:99px;background:var(--pri-soft);margin-top:5px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bars .n{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.bars .n small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tp{display:grid;grid-template-columns:70px minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.tp code{font-weight:800;letter-spacing:.03em}
.tp .tr{height:8px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.tp .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.tp span{text-align:right;color:var(--mute);font-size:13px;white-space:nowrap}
.ax{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ax h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.seg{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--pri-soft);margin-bottom:6px}
.seg i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;font-style:normal;white-space:nowrap;overflow:hidden}
.c0{background:#4E57A2}.c1{background:#7a84d1}.c2{background:#aab1e6;color:#2a3070!important}
.more{font:inherit;font-weight:700;color:var(--pri);background:var(--pri-soft);border:0;border-radius:10px;padding:9px 14px;margin-top:8px;cursor:pointer}
.kc{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.kc img{width:56px;height:56px;border-radius:34%;object-fit:cover;flex:none}
.kc .kn{font-size:18px;font-weight:800;display:flex;gap:6px;align-items:center}
.kc .kf{color:var(--mute)}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid #d1d6db;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pri{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;margin-top:18px}
button.pri:disabled{opacity:.5}
button.sm{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;width:auto;margin:0}
button.del{font:inherit;font-weight:700;border:1px solid var(--red);background:#fff;color:var(--red);padding:7px 12px;border-radius:9px;cursor:pointer}
.drop{display:flex;gap:14px;align-items:center;border:1.5px dashed #c4c9d0;border-radius:14px;padding:14px;background:#fafbfc}
.drop .pv{width:84px;height:84px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;flex:none}
.pvh{display:none}
.msg{margin-top:12px;font-weight:700}.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl img{width:52px;height:52px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.pl div{flex:1;min-width:0}.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{color:var(--mute)}
.empty{color:var(--mute);padding:14px 0;text-align:center}
#lg{max-width:360px;margin:70px auto;padding:0 20px;text-align:center}
.demo{background:#fff8e6;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}

header button{font:inherit;font-weight:700;border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:9px;cursor:pointer}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
.todo{border-radius:16px;padding:16px 18px;margin-bottom:12px;background:#fff4e6;color:#8a4b00}
.todo.ok{background:#e3f8f0;color:#0b7a5a}
.todo b{display:block;font-size:15px;margin-bottom:6px}
.todo a{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:6px 12px;margin:4px 6px 0 0;font-weight:700;color:#8a4b00;text-decoration:none;cursor:pointer}
.todo a i{font-style:normal;background:#f04452;color:#fff;border-radius:99px;min-width:22px;text-align:center;padding:0 6px;font-size:12px}
.kpi small em{font-style:normal;font-weight:700}.up{color:var(--ok)}.dn{color:var(--red)}
.flow{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--pri-soft);margin:6px 0 10px}
.flow i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:12.5px;min-width:0;overflow:hidden}
.f0{background:#f59f00}.f1{background:#4E57A2}.f2{background:#12b886}.f3{background:#adb5bd}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--mute);font-size:13px}.leg span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;background:var(--c)}
.go{float:right;font-size:13px;font-weight:700;color:var(--pri);text-decoration:none;cursor:pointer}
.bt{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.bt:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok)}.dot.w{background:#f59f00}.dot.r{background:var(--red)}.dot.g{background:#ced4da}
.bt span{color:var(--mute);font-size:12.5px;text-align:right;white-space:nowrap}.bt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri)}.tag.w{background:#fff4e6;color:#8a4b00}.tag.r{background:#fde8ea;color:var(--red)}
.o2{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.o2 .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:6px}
.o2 .br{border-top:1px solid var(--line);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.o2 .br>div:first-child{flex:1;min-width:230px}
.o2 select,.o2 input{width:auto;padding:8px 10px}
.s{color:var(--mute);font-size:13px}.okc{color:var(--ok);font-weight:700}.wn{color:var(--red);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{padding:9px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}.tbl th{color:var(--mute);font-weight:600;font-size:12.5px}.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.08em;word-break:break-all}
.newc{background:#eceef8;border-radius:14px;padding:16px;margin-bottom:12px}
button.g{font:inherit;font-weight:700;border:1px solid var(--pri);background:#fff;color:var(--pri);padding:8px 12px;border-radius:9px;cursor:pointer}
button.g:disabled{opacity:.5}
.lgp{max-width:380px;margin:60px auto;padding:0 20px}.lgp h2{text-align:center;margin:0 0 4px}
textarea{font:inherit;padding:10px;border:1px solid var(--line,#e5e8eb);border-radius:10px;background:var(--card,#fff);color:var(--ink,#191f28)}
/* ===== 스킨인사이드 운영 화면 테마: 강의사이트(GNRL STUDIO) 관리자 UI 구조 + 스킨인사이드 색 (다크) ===== */
/* 색은 이전 테마 그대로. 모양(머리글·탭·지표·카드·표·버튼·배지)만 강의사이트 관리자와 같게. 관리자·파트너 공용(scripts/theme.css). */
:root{--pri:#5560ea;--pri-soft:#1b2052;--ink:#eceef8;--mute:#8b91ab;--line:#252840;--bg:#0a0b11;--card:#10121b;--card2:#151827;--red:#ff6577;--ok:#35f0b0;--warn:#ffb54a;--warn-bg:#2a2010;--neon:#8d98ff;--neon-glow:none;--glow:0 0 0 1px var(--neon);--hd:#0a0b11;--ok-bg:#0d2a22;--red-bg:#33121a;--inp:#0b0c14;color-scheme:dark;
  --body:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--wrap:1180px;--gut:max(16px,calc((100% - var(--wrap)) / 2 + 16px))}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body);word-break:keep-all;letter-spacing:0;-webkit-font-smoothing:antialiased}
/* 머리글: 56px 한 줄, 기울인 굵은 로고 + 작은 회색 보조 글씨 */
header{background:var(--hd)!important;color:var(--ink)!important;border-bottom:1px solid var(--line);height:56px;padding:0 var(--gut)!important;display:flex;align-items:center;gap:16px;flex-wrap:nowrap!important}
header b{display:flex!important;align-items:baseline;gap:8px;font-size:16px!important;font-weight:800;font-style:italic;letter-spacing:.02em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header b span,header span{font-style:normal;font-weight:500!important;font-size:12px!important;color:var(--mute)!important;opacity:1!important;letter-spacing:0}
header>div{display:flex;align-items:baseline;gap:8px;min-width:0;overflow:hidden}header>div b{display:inline!important}
header button{border:0!important;background:none!important;color:var(--ink)!important;opacity:.75;padding:6px 0!important;font-size:13px!important;font-weight:500!important;border-radius:0!important;margin-left:auto;cursor:pointer}
header button:hover{opacity:1}
/* 탭: 머리글 아래 별도 띠, 위에 붙어 따라옴, 선택 탭은 3px 밑줄 */
nav,#tb .tabs{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);max-width:none!important;margin:0!important;padding:0 var(--gut)!important;display:flex;gap:4px!important;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar,#tb .tabs::-webkit-scrollbar{display:none}
nav button,#tb .tabs button{flex:none;border:0!important;border-radius:0!important;background:none!important;color:var(--mute)!important;padding:14px 14px 12px!important;border-bottom:3px solid transparent!important;font-weight:700;font-size:15px;white-space:nowrap;cursor:pointer}
nav button:hover,#tb .tabs button:hover{color:var(--ink)!important}
nav button.on,#tb .tabs button.on{color:var(--ink)!important;border-bottom-color:var(--neon)!important;background:none!important}
#tb .tabs{margin-bottom:0!important}
main{max-width:var(--wrap)!important;margin:0 auto!important;padding:24px 16px 80px!important}
/* 카드: 1px 테두리, 10px 모서리, 그림자 없음 */
.card,.o,.o2,.lgp,.rv{border:1px solid var(--line)!important;border-radius:10px!important;background:var(--card)!important;box-shadow:none!important}
.card,.o,.o2{padding:16px!important;margin-bottom:14px!important}
.card h2,.lgp h2{font-size:17px!important;font-weight:800;margin:0 0 4px!important;display:block}
.card h2:before{content:none}
.sub,.s{color:var(--mute)!important;font-size:13px}
.go{color:var(--neon)!important;font-family:var(--body)!important;font-size:13px!important;font-weight:700}
.grid2{gap:14px!important}
/* 핵심 지표: 한 칸씩 떨어진 카드, 작은 회색 이름 + 고정폭 숫자 */
.kpi,.cnt{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px!important;border:0!important;background:none!important;overflow:visible!important;margin-bottom:24px}
.card .kpi,.card .cnt{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-bottom:0}
.kpi div,.cnt button,.cnt a.cb,.big{background:var(--card)!important;border:1px solid var(--line)!important;border-radius:10px!important;padding:16px!important;box-shadow:none!important}
.card .kpi div,.card .cnt button,.card .cnt a.cb{background:var(--card2)!important}
.kpi small,.cnt button small,.cnt a.cb small{display:block;font-size:12px!important;letter-spacing:0;color:var(--mute)}
.kpi b,.cnt button b,.cnt a.cb b{display:block;font:600 24px/1.3 var(--mono)!important;margin-top:4px;letter-spacing:0;color:var(--ink);text-shadow:none}
.cnt button.on{border-color:var(--neon)!important;box-shadow:inset 0 -3px 0 var(--neon)!important}
.up{color:var(--ok)!important;font-family:var(--mono)}.dn{color:var(--red)!important;font-family:var(--mono)}
/* 파트너 홈 큰 숫자 */
.big{color:var(--ink)!important;border-left:3px solid var(--neon)!important;margin-bottom:14px}
.big small{color:var(--mute)!important;font-size:12px!important;opacity:1}
.big b{font:600 32px/1.25 var(--mono)!important;color:var(--ink)!important;margin-top:4px}
.big a{color:var(--neon)!important;font-weight:700}
.big.late{border-left-color:var(--red)!important}.big.late b{color:var(--red)!important}
.big.zero{border-left-color:var(--ok)!important}.big.zero b{color:var(--ok)!important}
/* 처리할 일 / 안내: 연한 바탕 상자, 8px 모서리 */
.todo{border:1px solid var(--warn)!important;background:var(--warn-bg)!important;color:var(--warn)!important;border-radius:8px!important;padding:14px 16px!important;margin-bottom:14px!important}
.todo.ok{border-color:var(--ok)!important;background:var(--ok-bg)!important;color:var(--ok)!important}
.todo b{font-size:15px}
.todo a{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:6px!important;padding:5px 10px!important;font-size:13px}
.todo a:hover{border-color:var(--neon)}
.todo a i{display:inline-block;min-width:18px;padding:0 5px!important;border-radius:9px!important;background:var(--red)!important;color:#fff;font:700 11px/18px var(--body)!important;text-align:center}
.note,.help{background:var(--warn-bg)!important;color:var(--warn)!important;border:1px solid #4a3a18!important;border-radius:8px!important;padding:10px 12px!important;font-size:13px!important}
/* 막대, 점 */
.flow,.seg,.bars .tr,.tp .tr{background:var(--pri-soft)!important;border-radius:6px!important}
.flow{height:30px!important}
.f1,.c0{background:var(--pri)!important}.f2{background:#0aa774!important}.f3{background:#7a8099!important}
.bars .tr i,.tp .tr i,.meter i{background:var(--neon)!important;box-shadow:none}
.bars .rk,.tp code,.code{font-family:var(--mono);color:var(--neon)!important}
.dot{background:var(--ok)!important}.dot.w{background:var(--warn)!important}.dot.r{background:var(--red)!important}.dot.g{background:var(--mute)!important}
/* 배지: 4px 모서리, 11px 굵게, 연한 바탕 */
.tag,.st,.bd,.al{display:inline-block;font:700 11px/1.6 var(--body)!important;padding:1px 7px!important;border-radius:4px!important;border:0!important;background:var(--line)!important;color:var(--mute)!important;white-space:nowrap;margin-right:4px}
.tag,.st,.bd.n{background:var(--pri-soft)!important;color:var(--neon)!important}
.tag.w,.bd.b{background:var(--warn-bg)!important;color:var(--warn)!important}
.tag.r,.st.c,.bd.l,.al{background:var(--red-bg)!important;color:var(--red)!important}
.st.d{background:var(--ok-bg)!important;color:var(--ok)!important}
.okc{color:var(--ok)!important}.wn{color:var(--red)!important}
/* 표: 회색 머리줄, 행 구분선, 숫자 오른쪽 정렬 고정폭 */
.tw{overflow-x:auto}
.card .tw,.card>.tbl{margin:0 -16px}.card .tw:last-child,.card>.tbl:last-child{margin-bottom:-16px}.card .tw:first-child,.card>.tbl:first-child{margin-top:-16px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{padding:10px 12px!important;border:0!important;border-bottom:1px solid var(--line)!important;text-align:left;vertical-align:middle;white-space:nowrap}
.tbl th{font-size:12px!important;font-weight:500!important;letter-spacing:0;text-transform:none;color:var(--mute);background:var(--card2)}
.tbl tr:last-child td{border-bottom:0!important}
.tbl td.r,.tbl th.r{text-align:right}.tbl td.r{font-family:var(--mono);font-size:13px}
.tbl tr.tot td{font-weight:800;background:var(--card2)}
.tbl a.ml{color:var(--neon);cursor:pointer;text-decoration:underline;font-weight:700}
.rw .s,.bt,.rw,.bars li,.pl,.o2 .br,.ax,.tk{border-color:var(--line)!important}
.rw b,.wk b,.bt span,.bars .n,.tp span{font-family:var(--mono)}
/* 입력: 6px 모서리, 얇은 테두리 */
input,select,textarea{background:var(--inp)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:6px!important;padding:8px 10px;font-size:14px}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--neon)!important;outline-offset:-1px;border-color:var(--line)!important;box-shadow:none!important}
input[type=checkbox],input[type=radio]{accent-color:var(--pri);padding:0}
label{font-size:13px!important;font-weight:600!important;letter-spacing:0;color:var(--ink)}
/* 버튼: 6px 모서리, 13px 굵게. 주 버튼=브랜드색, 보조=테두리만 */
button.pri,button.sm,button.sv,a.dl,.big+.x{background:var(--pri)!important;color:#fff!important;border:1px solid var(--pri)!important;border-radius:6px!important;font-weight:700;box-shadow:none!important}
button.sm,button.sv,a.dl{padding:7px 12px!important;font-size:13px!important}
button.pri{padding:11px 14px!important;font-size:14px!important}
button.pri:hover,button.sm:hover,button.sv:hover,a.dl:hover{filter:brightness(1.1)}
button.g,.bt2,button.del,.more,.chips button,main .tabs button{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:6px!important;padding:7px 12px!important;font-size:13px!important;font-weight:700;box-shadow:none!important;text-shadow:none!important}
button.g,.bt2:not(.red),.more{color:var(--neon)!important}

function boot(){

  var go = function(){ var b = document.getElementById("lgo"), m = document.getElementById("lm"); b.disabled = true; m.textContent = "";
    fetch("/api/admin/login", {method:"POST", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify({id:document.getElementById("li").value.trim(), pw:document.getElementById("lp").value, pw2:document.getElementById("l2").value})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); }); }).then(boot).catch(function(e){ b.disabled = false; m.textContent = e.message; document.getElementById("lp").value = ""; document.getElementById("l2").value = ""; }); };
  document.getElementById("lgo").onclick = go;
  document.getElementById("lsh").onchange = function(){ var t = this.checked ? "text" : "password"; document.getElementById("lp").type = t; document.getElementById("l2").type = t; };
  [].forEach.call(A.querySelectorAll("input"), function(i){ i.onkeydown = function(e){ if(e.key === "Enter") go(); }; });
}

  liveStop();

  [].forEach.call(A.querySelectorAll("nav button"), function(b){ b.onclick = function(){ go(b.dataset.t); }; });
  document.getElementById("lo").onclick = function(){ fetch("/api/admin/logout", {method:"POST", credentials:"same-origin"}).then(function(){ login(false); }); };
  ({home:home, reviews:reviews, cs:cs, orders:orders, brands:brands, settle:settle, add:add, stats:dash})[tab]();
}

/* ---------- 실시간 접속: 홈이 열려 있고 화면이 보이는 동안 15초마다 갱신 ---------- */
var LT = null;
function liveStop(){ if(LT){ clearInterval(LT); LT = null; } }
function liveStart(){ liveStop(); loadLive(); LT = setInterval(function(){ if(!document.hidden) loadLive(); }, 15000); }
function loadLive(){
  var el = document.getElementById("live"); if(!el){ liveStop(); return; }
  api("/api/admin/live").then(function(L){
    el = document.getElementById("live"); if(!el) return;
    var mx = Math.max(1, L.peak || 0), sr = L.series || [];
    el.innerHTML = '<h2><i class="pulse"></i>실시간 접속</h2><p class="sub">스토어·진단 화면을 지금 보고 있는 사람이에요. 15초마다 바뀌어요.</p>'
      + '<div class="lv"><div class="lv-now"><small>지금 접속 중</small><b>' + n(L.now) + '<span>명</span></b><div class="s">스토어 ' + n(L.pages.store) + ' · 진단 ' + n(L.pages.quiz) + '</div></div>'
      + '<div class="lv-k"><div><small>오늘 방문자</small><b>' + n(L.today) + '명</b></div><div><small>최근 30분 최고</small><b>' + n(L.peak) + '명</b></div></div>'
      + '<div class="lv-ch"><div class="lv-bars">' + sr.map(function(x){ return '<i title="' + x.t + ' · ' + x.n + '명" style="height:' + (x.n ? Math.max(6, x.n / mx * 100) : 2) + '%"' + (x.n ? '' : ' class="z"') + '></i>'; }).join("") + '</div><div class="lv-ax"><span>' + (sr[0] ? sr[0].t : "") + '</span><span>최근 30분 · 분당 접속자</span><span>' + (sr.length ? sr[sr.length - 1].t : "") + '</span></div></div></div>';
  }).catch(function(e){ if(e && e.message === "auth") return; var x = document.getElementById("live"); if(x && !x.querySelector(".lv")) x.querySelector(".empty").textContent = "접속 정보를 불러오지 못했어요."; });
}

    h += RF === "new" && c.new ? '<div class="row" style="margin-bottom:10px"><button class="g" id="rall">모두 확인했어요</button></div>' : '';

      var d = r.delReq;
      return '<div class="rv' + (r.low ? " low" : "") + '"><div class="rh"><span>' + stars(r.rating) + ' <span class="bd">' + esc(r.brandName) + '</span>' + (r.isNew ? '<span class="bd n">NEW</span>' : '') + (r.low ? '<span class="bd l">낮은 평점</span>' : '') + (r.best ? '<span class="bd b">베스트</span>' : '') + (d && d.status === "rejected" ? '<span class="bd">삭제 거부함</span>' : '') + '</span><span class="s">' + kst(r.createdAt) + '</span></div><div class="s">' + esc(r.productName) + ' · ' + esc(r.userName) + ' · ' + esc(r.orderId) + '</div><p>' + esc(r.text) + '</p>' + phHtml(r)
        + (pend(r) ? '<div class="card note" style="margin:8px 0"><small><b>삭제 요청 사유</b> ' + esc(d.reason) + ' · ' + kst(d.at) + '</small></div><div class="row"><button class="sm" data-d="approve" data-i="' + esc(r.id) + '">승인 (삭제)</button><button class="g" data-d="reject" data-i="' + esc(r.id) + '">거부</button></div>'
          : '<div class="row">' + (r.rating >= 4 ? '<button class="g" data-b="' + esc(r.id) + '" data-on="' + (r.best ? 0 : 1) + '">' + (r.best ? "베스트 해제" : "베스트로 선정 (" + (bestCnt[r.productId] || 0) + "/3)") + '</button>' : '') + '<button class="del" data-d="delete" data-i="' + esc(r.id) + '">직접 삭제</button></div>') + '<div class="msg" data-rm="' + esc(r.id) + '"></div></div>';

    var ra = document.getElementById("rall"); if(ra) ra.onclick = function(){ post("/api/admin/reviews/read", {ids:"all"}).then(reviews); };
    [].forEach.call(M().querySelectorAll("[data-b]"), function(b){ b.onclick = function(){ post("/api/admin/reviews/best", {id:b.dataset.b, on:b.dataset.on === "1"}).then(reviews).catch(function(e){ err(b.dataset.b, e); }); }; });
    [].forEach.call(M().querySelectorAll("[data-d]"), function(b){ b.onclick = function(){ if(b.dataset.d !== "reject" && b.dataset.s !== "1"){ b.dataset.s = "1"; b.textContent = "한 번 더 누르면 삭제돼요"; return; } post("/api/admin/reviews/decide", {id:b.dataset.i, action:b.dataset.d}).then(reviews).catch(function(e){ err(b.dataset.i, e); }); }; });

/* CS 자동 입력: 자주 쓰는 답변을 눌러서 채운다. 문구는 직접 추가·삭제할 수 있다 */
var TPL = null, TPLBN = "스킨인사이드";

function tplFill(text, cust){ return text.replace(/\{브랜드\}/g, TPLBN).replace(/\{고객\}(님)?/g, (cust || "고객") + "님"); }
function tplDraw(box, ta, cust){
  var h = '<div class="ah">누르면 답변칸에 채워져요. 고쳐서 보내도 돼요. {고객}·{브랜드}는 자동으로 바뀌어요.</div><div style="margin-top:8px">' + TPL.map(function(x){
    return '<div class="tp"><button type="button" class="pk" data-pk="' + esc(x.id) + '"><b>' + esc(x.title) + '</b><span>' + esc(x.text) + '</span></button><button type="button" class="x" data-px="' + esc(x.id) + '" title="삭제">×</button></div>'; }).join("") + '</div>'
    + '<div class="nw"><div class="ah">새 문구 추가 (' + TPL.length + '/12)</div><input data-nt maxlength="20" placeholder="제목 (예: 재입고 문의)"><textarea data-nx maxlength="600" placeholder="답변 내용" style="min-height:70px"></textarea><div class="autr"><button type="button" class="auto" data-pn>문구 추가</button><span class="msg" data-pm></span></div></div>';
  box.innerHTML = h;
  var say = function(t){ var m = box.querySelector("[data-pm]"); m.className = "msg e"; m.textContent = t; };
  [].forEach.call(box.querySelectorAll("[data-pk]"), function(b){ b.onclick = function(){ var x = TPL.filter(function(y){ return y.id === b.dataset.pk; })[0]; if(!x) return; ta.value = tplFill(x.text, cust); ta.focus(); box.hidden = true; }; });
  [].forEach.call(box.querySelectorAll("[data-px]"), function(b){ b.onclick = function(){
    if(!b.classList.contains("on")){ b.classList.add("on"); b.textContent = "삭제?"; setTimeout(function(){ b.classList.remove("on"); b.textContent = "×"; }, 3000); return; }
    api("/api/admin/cs/templates/delete", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({id:b.dataset.px})}).then(function(j){ TPL = j.templates; tplDraw(box, ta, cust); }).catch(function(e){ if(e.message !== "auth") say(e.message); }); }; });
  box.querySelector("[data-pn]").onclick = function(){
    api("/api/admin/cs/templates/add", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({title:box.querySelector("[data-nt]").value, text:box.querySelector("[data-nx]").value})}).then(function(j){ TPL = j.templates; tplDraw(box, ta, cust); }).catch(function(e){ if(e.message !== "auth") say(e.message); }); };
}
function tplWire(root){
  [].forEach.call(root.querySelectorAll("[data-au]"), function(b){ b.onclick = function(){
    var id = b.dataset.au, box = root.querySelector('[data-aup="' + id + '"]'), ta = root.querySelector('[data-tx="' + id + '"]');
    if(!box.hidden){ box.hidden = true; return; }
    tplLoad().then(function(){ tplDraw(box, ta, b.dataset.cu); box.hidden = false; }).catch(function(e){ if(e.message !== "auth"){ box.hidden = false; box.textContent = e.message; } }); }; });

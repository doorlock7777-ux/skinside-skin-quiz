<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>스킨인사이드 주문 관리</title>
<style>
body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;background:#f2f4f6;color:#191f28;font-size:14px}
header{background:#4E57A2;color:#fff;padding:14px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:17px;flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid #d1d6db;border-radius:8px;background:#fff}
button{cursor:pointer;background:#4E57A2;color:#fff;border-color:#4E57A2;font-weight:700}
button.g{background:#fff;color:#4E57A2}button.r{background:#fff;color:#f04452;border-color:#f04452}
.o{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700;margin-bottom:8px}
.st{font-size:12px;padding:3px 10px;border-radius:999px;background:#eceef8;color:#4E57A2}
.br{border-top:1px solid #e5e8eb;padding:10px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.br>div:first-child{flex:1;min-width:240px}
.s{color:#6b7684;font-size:13px}
#lg{padding:40px 16px;text-align:center}
.pn{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}.pn h3{margin:0 0 6px;font-size:15px}.pn table{width:100%;border-collapse:collapse;font-size:13px}.pn td,.pn th{padding:7px 6px;border-top:1px solid #e5e8eb;text-align:left}.hp{background:#fff8e6;color:#8a5a00;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}.ok{color:#12b886;font-weight:700}.wn{color:#f04452;font-weight:700}
</style></head>
<body>
<header><b>스킨인사이드 주문 관리</b><a href="/admin/" style="color:#fff;font-weight:700">관리자 홈</a><input id="mo" type="month" aria-label="정산 월"><button class="g" id="st">정산 CSV</button><button class="g" id="rf">새로고침</button><button class="g" id="bm">브랜드 메일·링크</button></header>
<main id="m"></main>
<script>
var T = sessionStorage.getItem("adm") || "", M = document.getElementById("m");
var CAR = {cj:"CJ대한통운", lotte:"롯데택배", hanjin:"한진택배", post:"우체국", logen:"로젠택배"};
var STL = {paid:"결제 완료", partial:"일부 발송", shipped:"발송 완료", canceled:"취소됨", failed:"결제 실패"};
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function api(p, o){ o = o || {}; o.headers = Object.assign({authorization:"Bearer " + T}, o.headers || {}); return fetch(p, o); }
function post(p, b){ return api(p, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(b)}).then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); return j; }); }); }
document.getElementById("mo").value = new Date().toISOString().slice(0, 7);
function login(){ M.innerHTML = '<div id="lg"><p>관리자 토큰을 입력하세요</p><input id="tk" type="password" style="width:260px"> <button id="ok">확인</button></div>'; document.getElementById("ok").onclick = function(){ T = document.getElementById("tk").value.trim(); sessionStorage.setItem("adm", T); load(); }; }
function load(){
  api("/api/admin/orders").then(function(r){ if(r.status === 401){ sessionStorage.removeItem("adm"); login(); throw 0; } return r.json(); }).then(function(j){
    if(!j.orders.length){ M.innerHTML = '<div id="lg">아직 주문이 없어요.</div>'; return; }
    M.innerHTML = '<div class="hp">송장번호는 브랜드가 메일의 링크에서 직접 입력하면 자동으로 여기에 반영돼요. 아래 입력칸은 브랜드가 대신 알려줄 때만 쓰세요.</div>' + j.orders.map(function(o){
      var a = o.ship || {}, by = {};
      o.items.forEach(function(l){ (by[l.brand] = by[l.brand] || []).push(l); });
      var h = '<div class="o"><div class="h"><span>' + esc(o.id) + ' · ' + new Date(o.createdAt).toLocaleString("ko-KR") + '</span><span class="st">' + (STL[o.status] || esc(o.status)) + ' · ' + o.total.toLocaleString() + '원</span></div>'
        + '<div class="s">' + esc(a.name) + ' / ' + esc(a.phone) + ' / (' + esc(a.zip) + ') ' + esc(a.addr1) + ' ' + esc(a.addr2) + (a.memo ? ' / 메모: ' + esc(a.memo) : '') + '</div>';
      Object.keys(by).forEach(function(k){
        var sh = (o.shipments || {})[k] || {}, nm = (j.brands[k] && j.brands[k].name) || k;
        var sd = (o.sent || {})[k]; h += '<div class="br"><div><b>' + esc(nm) + '</b> <span class="' + (sd ? 'ok' : 's') + '">' + (sd ? '브랜드 전달 완료 ' + new Date(sd).toLocaleString("ko-KR") : '다음 날 아침 9시에 전달') + '</span><div class="s">' + by[k].map(function(l){ return esc(l.name) + (l.optName ? ' (' + esc(l.optName) + ')' : '') + ' x' + l.q; }).join('<br>') + '</div></div>'
          + '<select data-c="' + esc(o.id + '|' + k) + '">' + Object.keys(CAR).map(function(c){ return '<option value="' + c + '"' + (sh.carrier === c ? ' selected' : '') + '>' + CAR[c] + '</option>'; }).join("") + '</select>'
          + '<input data-t="' + esc(o.id + '|' + k) + '" placeholder="송장번호" value="' + esc(sh.tracking || "") + '"><button data-s="' + esc(o.id + '|' + k) + '">저장</button></div>';
      });
      if(["paid", "partial", "shipped"].indexOf(o.status) >= 0) h += '<div style="margin-top:8px"><button class="r" data-x="' + esc(o.id) + '">결제 취소·환불</button></div>';
      return h + '</div>';
    }).join("");
    [].forEach.call(M.querySelectorAll("[data-s]"), function(b){ b.onclick = function(){
      var k = b.dataset.s, p = k.split("|");
      post("/api/admin/ship", {orderId:p[0], brand:p[1], carrier:M.querySelector('[data-c="' + k + '"]').value, tracking:M.querySelector('[data-t="' + k + '"]').value}).then(load).catch(function(e){ alert(e.message); });
    }; });
    [].forEach.call(M.querySelectorAll("[data-x]"), function(b){ b.onclick = function(){
      if(!confirm("이 주문을 전액 취소하고 환불할까요?")) return;
      post("/api/admin/cancel", {orderId:b.dataset.x}).then(load).catch(function(e){ alert(e.message); });
    }; });
  }).catch(function(e){ if(e !== 0) M.innerHTML = '<div id="lg">불러오지 못했어요.</div>'; });
}
document.getElementById("bm").onclick = function(){
  Promise.all([post("/api/manage/brand-mail", {dry:true}), api("/api/manage/brand-links").then(function(r){ return r.json(); })]).then(function(r){
    var res = r[0].results || [], ls = r[1].links || [];
    var h = '<div class="pn"><h3>오늘 아침 9시에 나갈 브랜드 메일</h3>' + (res.length ? '<table><tr><th>브랜드</th><th>신규 주문</th><th>취소</th><th>이메일</th></tr>' + res.map(function(x){ return '<tr><td>' + esc(x.name) + '</td><td>' + x.orders + '건</td><td>' + x.cancels + '건</td><td>' + (x.email ? esc(x.email) : '<span class="wn">미등록</span>') + '</td></tr>'; }).join("") + '</table><button id="snd" style="margin-top:10px">지금 바로 보내기</button> <span id="sm" class="s"></span>' : '<div class="s">지금 보낼 주문이 없어요.</div>') + '</div>'
      + '<div class="pn"><h3>브랜드별 송장 입력 링크</h3><div class="s" style="margin-bottom:6px">매일 메일에 자동으로 들어가요. 직접 알려줄 때 복사해서 쓰세요.</div><table>' + ls.map(function(l){ return '<tr><td>' + esc(l.name) + '</td><td>' + (l.email ? esc(l.email) : '<span class="wn">이메일 미등록</span>') + '</td><td><button class="g" data-cp="' + esc(l.link) + '">링크 복사</button></td></tr>'; }).join("") + '</table></div>';
    M.innerHTML = h + '<div style="text-align:center"><button class="g" id="bk">주문 목록으로</button></div>';
    document.getElementById("bk").onclick = load;
    var sb = document.getElementById("snd"); if(sb) sb.onclick = function(){ sb.disabled = true; post("/api/manage/brand-mail", {dry:false}).then(function(q){ document.getElementById("sm").textContent = (q.results || []).filter(function(x){ return x.sent; }).length + "곳 전달했어요"; }).catch(function(e){ document.getElementById("sm").textContent = e.message; }); };
    [].forEach.call(M.querySelectorAll("[data-cp]"), function(b){ b.onclick = function(){ try{ navigator.clipboard.writeText(b.dataset.cp); b.textContent = "복사됨"; }catch(e){ prompt("링크", b.dataset.cp); } }; });
  }).catch(function(e){ if(e.message) M.innerHTML = '<div id="lg">' + esc(e.message) + '</div>'; });
};
document.getElementById("rf").onclick = function(){ T ? load() : login(); };
document.getElementById("st").onclick = function(){
  api("/api/admin/settlement?month=" + document.getElementById("mo").value).then(function(r){ return r.blob(); }).then(function(b){ var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "settlement-" + document.getElementById("mo").value + ".csv"; a.click(); });
};
T ? load() : login();
</script></body></html>

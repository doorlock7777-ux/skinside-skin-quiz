<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>스킨인사이드 관리자</title>
<style>
:root{--pri:#4E57A2;--pri-soft:#eceef8;--ink:#191f28;--mute:#6b7684;--line:#e5e8eb;--bg:#f2f4f6;--card:#fff;--red:#f04452;--ok:#12b886}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--pri);color:#fff;padding:14px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:17px;flex:1;min-width:120px}
header a{color:#fff;font-weight:700;text-decoration:none;opacity:.9}
nav{display:flex;gap:6px;max-width:980px;margin:0 auto;padding:14px 16px 0}
nav button{flex:none;font:inherit;font-weight:700;border:0;background:transparent;color:var(--mute);padding:10px 14px;border-radius:999px;cursor:pointer}
nav button.on{background:var(--ink);color:#fff}
main{max-width:980px;margin:0 auto;padding:12px 16px 60px}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:12px}
.card h2{margin:0 0 4px;font-size:17px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;margin-bottom:12px}
.chips button{font:inherit;font-weight:600;border:0;background:var(--card);color:#4e5968;padding:8px 14px;border-radius:999px;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border-radius:16px;padding:16px}
.kpi small{display:block;color:var(--mute);font-size:12.5px}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.bars{list-style:none;margin:0;padding:0}
.bars li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.bars li:first-child{border-top:0}
.bars .rk{font-weight:800;color:var(--pri);text-align:center}
.bars .nm{min-width:0}
.bars .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .nm span{color:var(--mute);font-size:12px}
.bars .tr{height:6px;border-radius:99px;background:var(--pri-soft);margin-top:5px;overflow:hidden}
.bars .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bars .n{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.bars .n small{display:block;font-weight:400;color:var(--mute);font-size:11.5px}
.tp{display:grid;grid-template-columns:70px minmax(0,1fr) 112px;gap:10px;align-items:center;padding:6px 0;font-variant-numeric:tabular-nums}
.tp code{font-weight:800;letter-spacing:.03em}
.tp .tr{height:8px;border-radius:99px;background:var(--pri-soft);overflow:hidden}
.tp .tr i{display:block;height:100%;background:var(--pri);border-radius:99px}
.tp span{text-align:right;color:var(--mute);font-size:13px;white-space:nowrap}
.ax{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.ax h3{margin:0 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.seg{display:flex;height:26px;border-radius:8px;overflow:hidden;background:var(--pri-soft);margin-bottom:6px}
.seg i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11.5px;font-weight:700;font-style:normal;white-space:nowrap;overflow:hidden}
.c0{background:#4E57A2}.c1{background:#7a84d1}.c2{background:#aab1e6;color:#2a3070!important}
.more{font:inherit;font-weight:700;color:var(--pri);background:var(--pri-soft);border:0;border-radius:10px;padding:9px 14px;margin-top:8px;cursor:pointer}
.kc{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.kc img{width:56px;height:56px;border-radius:34%;object-fit:cover;flex:none}
.kc .kn{font-size:18px;font-weight:800;display:flex;gap:6px;align-items:center}
.kc .kf{color:var(--mute)}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid #d1d6db;border-radius:10px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.pri{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;margin-top:18px}
button.pri:disabled{opacity:.5}
button.sm{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;width:auto;margin:0}
button.del{font:inherit;font-weight:700;border:1px solid var(--red);background:#fff;color:var(--red);padding:7px 12px;border-radius:9px;cursor:pointer}
.drop{display:flex;gap:14px;align-items:center;border:1.5px dashed #c4c9d0;border-radius:14px;padding:14px;background:#fafbfc}
.drop .pv{width:84px;height:84px;border-radius:12px;background:#fff;border:1px solid var(--line);object-fit:contain;flex:none}
.pvh{display:none}
.msg{margin-top:12px;font-weight:700}.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.pl{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl img{width:52px;height:52px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none}
.pl div{flex:1;min-width:0}.pl b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl small{color:var(--mute)}
.empty{color:var(--mute);padding:14px 0;text-align:center}
#lg{max-width:360px;margin:70px auto;padding:0 20px;text-align:center}
.demo{background:#fff8e6;color:#8a5a00;font-size:12.5px;text-align:center;padding:8px 16px}
</style></head>
<body>
<div id="dm" class="demo" hidden></div>
<header><b>스킨인사이드 관리자</b><a href="/admin/orders.html">주문 관리</a><a href="/store">스토어 보기</a></header>
<div id="app"></div>

var T = "", A = document.getElementById("app"), tab = "dash", days = 7, CATS = {}, EXTRA = [];
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ return Number(v || 0).toLocaleString("ko-KR"); }
function api(p, o){ o = o || {}; o.headers = Object.assign({authorization:"Bearer " + T}, o.headers || {}); return fetch(p, o).then(function(r){ if(r.status === 401){ try{ sessionStorage.removeItem("adm"); }catch(e){} login(true); throw new Error("auth"); } return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); return j; }); }); }
function post(p, b){ return api(p, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(b)}); }

/* 로그인: 관리자 링크(#k=토큰)로 들어오면 자동 로그인, 아니면 토큰 입력 */
function boot(){
  var m = location.hash.match(/[#&]k=([^&]+)/);
  if(m){ T = decodeURIComponent(m[1]); try{ sessionStorage.setItem("adm", T); }catch(e){} history.replaceState(null, "", location.pathname); }
  else { try{ T = sessionStorage.getItem("adm") || ""; }catch(e){} }
  if(!T) return login(false);
  fetch("/data/products.json").then(function(r){ return r.json(); }).then(function(j){ CATS = j.categories || {}; }).catch(function(){}).then(show);
}
function login(bad){
  A.innerHTML = '<div id="lg"><h2>관리자 확인</h2><p class="sub">' + (bad ? '링크 또는 토큰이 맞지 않아요.' : '관리자 링크로 들어오거나 토큰을 입력해주세요.') + '</p><input id="tk" type="password" placeholder="관리자 토큰" autocomplete="off"><button class="pri" id="ok">확인</button></div>';
  document.getElementById("ok").onclick = function(){ T = document.getElementById("tk").value.trim(); try{ sessionStorage.setItem("adm", T); }catch(e){} boot2(); };
}
function boot2(){ fetch("/data/products.json").then(function(r){ return r.json(); }).then(function(j){ CATS = j.categories || {}; }).catch(function(){}).then(show); }

function show(){
  A.innerHTML = '<nav><button data-t="dash">대시보드</button><button data-t="add">제품 추가</button></nav><main id="mn"></main>';
  [].forEach.call(A.querySelectorAll("nav button"), function(b){ b.onclick = function(){ tab = b.dataset.t; show(); }; b.className = b.dataset.t === tab ? "on" : ""; });
  (tab === "dash" ? dash : add)();
}

/* ---------- 대시보드 ---------- */
function dash(){
  var M = document.getElementById("mn");
  M.innerHTML = '<div class="chips" id="pd"></div><div id="dv"><div class="empty">불러오는 중...</div></div>';
  var pd = document.getElementById("pd");
  [[1, "오늘"], [7, "7일"], [30, "30일"]].forEach(function(x){ var b = document.createElement("button"); b.textContent = x[1]; b.className = days === x[0] ? "on" : ""; b.onclick = function(){ days = x[0]; dash(); }; pd.appendChild(b); });
  Promise.all([api("/api/manage/dashboard?days=" + days), fetch(COUNTER_API).then(function(r){ return r.json(); }).catch(function(){ return null; })]).then(function(r){ paint(r[0], r[1]); }).catch(function(e){ if(e.message !== "auth") document.getElementById("dv").innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
function paint(d, st){
  var ev = d.events || {}, top = d.top || [], mx = top.length ? top[0].clicks : 1, k = d.kakao || {};
  var h = '<div class="kpi"><div><small>진단 시작</small><b>' + n(ev.quiz_start) + '</b></div><div><small>진단 완료</small><b>' + n(ev.quiz_done) + '</b></div><div><small>채널 추가 버튼 클릭</small><b>' + n(ev.kakao_click) + '</b></div><div><small>채널 추가 후 결과 보기</small><b>' + n(ev.kakao_unlock) + '</b></div></div>';
  h += '<div class="grid2"><div class="card"><h2>클릭수 TOP 10 제품</h2><p class="sub">최근 ' + (days === 1 ? '오늘' : days + '일') + ' 동안 구매 링크를 누른 횟수예요.</p>';
  h += top.length ? '<ol class="bars" style="padding:0">' + top.map(function(p, i){ return '<li><span class="rk">' + (i + 1) + '</span><div class="nm"><b>' + esc(p.name) + '</b><span>' + esc(p.brand) + '</span><div class="tr"><i style="width:' + Math.max(4, Math.round(p.clicks / mx * 100)) + '%"></i></div></div><div class="n">' + n(p.clicks) + '회<small>조회 ' + n(p.views) + '</small></div></li>'; }).join("") + '</ol>' : '<div class="empty">아직 클릭 기록이 없어요.</div>';
  h += '</div><div class="card"><h2>피부타입 통계</h2>' + types(st) + '</div></div>';
  h += '<div class="card"><h2>내 카카오톡 채널</h2><p class="sub">카카오는 친구 수를 실시간으로 제공하지 않아서 숫자는 직접 입력해요.</p><div class="kc"><img src="' + AV + '" alt=""><div><div class="kn">' + esc(k.name || "문장군") + ' <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#2F80ED"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="kf">친구 <b id="kfv">' + n(k.friends) + '</b>' + (k.updated ? ' · ' + new Date(k.updated).toLocaleDateString("ko-KR") + ' 입력' : '') + '</div></div></div>';
  h += '<div class="row"><input id="kfi" type="number" inputmode="numeric" min="0" placeholder="현재 친구 수" value="' + (k.friends || "") + '" style="max-width:200px"><button class="sm" id="kfs">저장</button><span class="msg" id="kfm"></span></div>';
  var cv = ev.kakao_click ? Math.round(ev.kakao_unlock / ev.kakao_click * 100) : 0;
  h += '<p class="sub" style="margin:14px 0 0">최근 ' + (days === 1 ? '오늘' : days + '일') + ' 채널 추가 버튼 클릭 ' + n(ev.kakao_click) + '회 · 결과 보기 ' + n(ev.kakao_unlock) + '회' + (ev.kakao_click ? ' (전환 ' + cv + '%)' : '') + '</p></div>';
  document.getElementById("dv").innerHTML = h;
  document.getElementById("kfs").onclick = function(){ var v = document.getElementById("kfi").value, m = document.getElementById("kfm"); post("/api/manage/kakao", {friends:v, name:k.name || "문장군"}).then(function(r){ document.getElementById("kfv").textContent = n(r.kakao.friends); m.className = "msg o"; m.textContent = "저장했어요"; }).catch(function(e){ m.className = "msg e"; m.textContent = e.message; }); };
  var mb = document.getElementById("tpm"); if(mb) mb.onclick = function(){ document.getElementById("tpl").dataset.all = "1"; fillTypes(); mb.remove(); };
  window.__ST = st; fillTypes();
}
var AXES = [["피지", [["지성", "O"], ["복합성", "C"], ["건성", "D"]]], ["민감도", [["민감성", "S"], ["저항성", "R"]]], ["색소", [["색소성", "P"], ["비색소", "N"]]], ["주름", [["주름", "W"], ["탄력", "T"]]]];
function types(st){
  if(!st || !st.types) return '<div class="empty">통계를 불러오지 못했어요.</div>';
  return '<p class="sub">지금까지 진단한 ' + n(st.total) + '명의 분포예요.</p><div id="tpl"></div><button class="more" id="tpm">전체 타입 보기</button><div id="axs"></div>';
}
function fillTypes(){
  var st = window.__ST, el = document.getElementById("tpl"); if(!el || !st || !st.types) return;
  var ks = Object.keys(st.types).filter(function(k){ return st.types[k] > 0; }).sort(function(a, b){ return st.types[b] - st.types[a]; }), tot = ks.reduce(function(a, k){ return a + st.types[k]; }, 0) || 1, all = el.dataset.all === "1", mx = ks.length ? st.types[ks[0]] : 1;
  el.innerHTML = ks.slice(0, all ? ks.length : 8).map(function(k){ return '<div class="tp"><code>' + esc(k) + '</code><div class="tr"><i style="width:' + Math.max(3, Math.round(st.types[k] / mx * 100)) + '%"></i></div><span>' + n(st.types[k]) + '명 · ' + Math.round(st.types[k] / tot * 100) + '%</span></div>'; }).join("") || '<div class="empty">아직 진단 기록이 없어요.</div>';
  var ax = document.getElementById("axs");
  if(ax) ax.innerHTML = AXES.map(function(a, i){
    var cnt = a[1].map(function(o){ return ks.reduce(function(s, k){ return s + (k.charAt(i) === o[1] ? st.types[k] : 0); }, 0); }), sum = cnt.reduce(function(x, y){ return x + y; }, 0) || 1;
    return '<div class="ax"><h3>' + a[0] + '</h3><div class="seg">' + a[1].map(function(o, j){ var p = Math.round(cnt[j] / sum * 100); return p ? '<i class="c' + j + '" style="width:' + p + '%">' + o[0] + ' ' + p + '%</i>' : ''; }).join("") + '</div></div>';
  }).join("");
}

/* ---------- 제품 추가 ---------- */
var IMG = "";
function add(){
  var M = document.getElementById("mn"); IMG = "";
  var opts = Object.keys(CATS).map(function(k){ return '<option value="' + esc(k) + '">' + esc(CATS[k]) + '</option>'; }).join("");
  M.innerHTML = '<div class="card"><h2>제품 추가</h2><p class="sub">입력하고 등록하면 스토어에 바로 나타나요.</p>'
    + '<label>제품 이미지</label><div class="drop"><img class="pv" id="pv" alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="><div><input type="file" id="fi" accept="image/*"><div class="sub" style="margin:6px 0 0">정사각형에 가까운 제품 사진을 권장해요.</div></div></div>'
    + '<label>제품명</label><input id="fn" maxlength="80" placeholder="예: 시카 진정 앰플">'
    + '<label>브랜드명</label><input id="fb" maxlength="40" placeholder="예: LIVNA">'
    + '<div class="two"><div><label>정가 (원)</label><input id="fl" type="number" inputmode="numeric" min="0" placeholder="34000"></div><div><label>할인가 (원)</label><input id="fp" type="number" inputmode="numeric" min="0" placeholder="26900"></div></div><div class="sub" id="fd" style="margin:6px 0 0"></div>'
    + '<label>카테고리</label><select id="fc">' + opts + '</select>'
    + '<label>바로가기 링크</label><input id="fu" type="url" placeholder="https://">'
    + '<button class="pri" id="fs">제품 등록</button><div class="msg" id="fm"></div></div>'
    + '<div class="card"><h2>추가한 제품</h2><div id="pl"><div class="empty">불러오는 중...</div></div></div>';
  var $ = function(i){ return document.getElementById(i); };
  function disc(){ var l = +$("fl").value, p = +$("fp").value; $("fd").textContent = l > 0 && p > 0 ? (p > l ? "할인가가 정가보다 커요" : p < l ? Math.round((l - p) / l * 100) + "% 할인" : "할인 없음") : ""; }
  $("fl").oninput = disc; $("fp").oninput = disc;
  $("fi").onchange = function(){ var f = this.files[0]; if(!f) return; shrink(f).then(function(u){ IMG = u; $("pv").src = u; }).catch(function(){ IMG = ""; msg("이미지를 읽지 못했어요", 1); }); };
  function msg(t, e){ var m = $("fm"); m.className = "msg " + (e ? "e" : "o"); m.textContent = t; }
  $("fs").onclick = function(){
    var b = this; if(!IMG) return msg("이미지를 선택해주세요", 1);
    b.disabled = true; msg("등록 중...");
    post("/api/manage/product", {img:IMG, name:$("fn").value, brandName:$("fb").value, list:$("fl").value, price:$("fp").value, cat:$("fc").value, url:$("fu").value}).then(function(){ msg("등록했어요. 스토어에 바로 반영돼요."); ["fn", "fb", "fl", "fp", "fu"].forEach(function(i){ $(i).value = ""; }); $("fi").value = ""; $("pv").src = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="; IMG = ""; disc(); list(); }).catch(function(e){ if(e.message !== "auth") msg(e.message, 1); }).then(function(){ b.disabled = false; });
  };
  list();
}
function list(){
  api("/api/manage/products").then(function(j){
    var el = document.getElementById("pl"); if(!el) return; EXTRA = j.products || [];
    el.innerHTML = EXTRA.length ? EXTRA.map(function(p){ return '<div class="pl"><img src="' + esc(p.img) + '" alt=""><div><b>' + esc(p.name) + '</b><small>' + esc(p.brandName) + ' · ' + esc(CATS[p.cat] || p.cat) + ' · ' + n(p.price) + '원' + (p.list ? ' (정가 ' + n(p.list) + '원)' : '') + '</small></div><button class="del" data-id="' + esc(p.id) + '">삭제</button></div>'; }).join("") : '<div class="empty">추가한 제품이 없어요.</div>';
    [].forEach.call(el.querySelectorAll(".del"), function(b){ b.onclick = function(){ if(b.dataset.s !== "1"){ b.dataset.s = "1"; b.textContent = "한 번 더 눌러 삭제"; return; } post("/api/manage/product-delete", {id:b.dataset.id}).then(list).catch(function(){}); }; });
  }).catch(function(){});
}
/* 이미지를 800px, webp로 줄여 올린다 */
function shrink(f){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(f), im = new Image();
    im.onload = function(){ var s = Math.min(1, 800 / Math.max(im.width, im.height)), c = document.createElement("canvas"); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(u); var o = c.toDataURL("image/webp", 0.85); if(o.indexOf("data:image/webp") !== 0) o = c.toDataURL("image/jpeg", 0.88); res(o); };
    im.onerror = function(){ rej(); }; im.src = u;
  });
}
boot();

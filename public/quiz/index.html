<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>스킨인사이드 피부타입 진단</title>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 브랜드 밴드 + 진행바, 본문은 밝은 바탕 위 얇은 선 카드. 선택지는 한 줄 행으로 통일 */
:root{--brand:#4E57A2;--bg:#F6F7FB;--card:#fff;--text:#171A33;--muted:#5F6488;--line:#E1E4F0;--accent:#4E57A2;--on-accent:#fff;--soft:#EDEEF8;--shadow:0 1px 2px rgba(23,26,51,.05),0 8px 24px rgba(78,87,162,.08);--btn-shadow:0 6px 16px rgba(78,87,162,.28);
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101228;--card:#1A1D3D;--text:#EEF0FF;--muted:#A3A8D0;--line:#2C3068;--accent:#8E98E8;--on-accent:#10122B;--soft:#262A58;--shadow:none;--btn-shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101228;--card:#1A1D3D;--text:#EEF0FF;--muted:#A3A8D0;--line:#2C3068;--accent:#8E98E8;--on-accent:#10122B;--soft:#262A58;--shadow:none;--btn-shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans KR","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:10}
header{background:var(--brand);text-align:center;padding:22px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
header img{display:block;margin:0 auto;width:min(78%,300px);height:auto}
.bar{height:4px;background:var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
#app.slide{animation:slideIn .5s cubic-bezier(.22,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){#app.slide{animation:none}.bar i,.opt{transition:none}}
main{max-width:540px;margin:0 auto;padding-block:28px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2{margin:0 0 12px;line-height:1.35;letter-spacing:-.4px;font-weight:700;text-wrap:balance}
h1{font-size:26px}h2{font-size:22px}
p{margin:0 0 14px}
b{font-weight:700}
.muted{color:var(--muted);font-size:14px}
.step{font-size:12.5px;font-weight:700;letter-spacing:.05em;color:var(--accent);margin-bottom:10px}
.big{font-size:clamp(30px,9vw,40px);font-weight:800;line-height:1.3;letter-spacing:-1.2px;color:var(--text);margin:22px 0 28px}
.big::after{content:"";display:block;width:44px;height:4px;background:var(--accent);margin-top:18px}
.code{font-family:"Michroma","Arial Black",sans-serif;font-size:clamp(34px,11vw,54px);font-weight:700;color:var(--accent);letter-spacing:2px;line-height:1.15;margin:6px 0 16px}
.nick{font-size:13px;font-weight:700;letter-spacing:.05em;color:var(--muted);margin-bottom:2px}
.subl{font-size:15px;color:var(--muted);margin:-2px 0 14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.box>b:first-child{display:block;font-size:15px;margin-bottom:8px}
.box.muted{box-shadow:none;background:var(--soft);border-color:transparent}
ul{padding-left:18px;margin:8px 0}li{margin:5px 0}
.opt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;text-align:left;font:inherit;font-weight:500;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,background .15s,transform .1s}
.opt::after{content:"";flex:none;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);opacity:.55}
.opt:hover,.opt:active{border-color:var(--accent);background:var(--soft)}
.opt:active{transform:scale(.99)}
.btn{display:block;width:100%;font:inherit;font-weight:700;color:var(--on-accent);background:var(--accent);border:0;border-radius:12px;padding:16px;margin-top:10px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:var(--btn-shadow)}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.small{font-size:14px;padding:12px}

/* 카카오톡 채널 추가 */
.kk{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;font:inherit;font-weight:700;font-size:16px;color:#191919;background:#FEE500;border:0;border-radius:12px;padding:16px;margin-top:14px;text-decoration:none;cursor:pointer}
.kk:active{background:#F5DC00}
.kk svg{flex:none}
.kc{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:18px 0 0}
.kc .kav{width:60px;height:60px;border-radius:34%;object-fit:cover;flex:none}
.kc .kn{display:flex;align-items:center;gap:6px;font-size:19px;font-weight:800;line-height:1.3}
.kc .kf{color:var(--muted);font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
.kd{color:var(--muted);font-size:14px;margin:10px 2px 0}
/* 분석 중 */
.an{text-align:center;padding:34px 0 10px}
.an .ring{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;background:conic-gradient(var(--accent) 0 28%,var(--line) 28% 100%);-webkit-mask:radial-gradient(circle,transparent 55%,#000 57%);mask:radial-gradient(circle,transparent 55%,#000 57%);animation:anspin 1s linear infinite}
@keyframes anspin{to{transform:rotate(360deg)}}
.an h2{margin:0 0 6px;font-size:22px}
.ans{list-style:none;padding:0;margin:26px auto 22px;max-width:300px;text-align:left}
.ans li{display:flex;align-items:center;gap:10px;padding:7px 0;color:var(--muted);font-size:15px;transition:color .3s}
.ans li i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;transition:all .3s}
.ans li.on{color:var(--text);font-weight:700}
.ans li.on i{border-color:var(--accent);border-top-color:transparent;animation:anspin .8s linear infinite}
.ans li.ok{color:var(--text)}
.ans li.ok i{background:var(--accent);border-color:var(--accent);animation:none;position:relative}
.ans li.ok i::after{content:"";position:absolute;left:5px;top:2px;width:5px;height:9px;border:solid var(--on-accent);border-width:0 2px 2px 0;transform:rotate(45deg)}
.anb{height:6px;border-radius:99px;background:var(--line);overflow:hidden;max-width:300px;margin:0 auto}
.anb i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;animation:anfill 4s linear forwards}
@keyframes anfill{to{width:100%}}
@media (prefers-reduced-motion:reduce){.an .ring,.ans li.on i{animation-duration:3s}}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:16px auto 0}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;line-height:1.6}
.clock{font-family:"Michroma",monospace;font-size:clamp(40px,13vw,54px);text-align:center;margin:20px 0 8px;font-variant-numeric:tabular-nums;color:var(--accent);letter-spacing:1px}
.tag{display:inline-block;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:999px;padding:2px 12px;font-size:14px}
.lr{display:flex;gap:14px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}
.lr:first-of-type{border-top:0}
.lr .tag{flex:none;display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:10px;font-family:"Michroma",sans-serif;font-size:15px}
.lr b{display:block;font-size:15px}
.lr span:not(.tag){font-size:13px;color:var(--muted)}
.ga{margin:14px 0}
.gl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.gb{position:relative;height:8px;background:var(--soft);border-radius:4px}
.gb i{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--card);transform:translate(-50%,-50%)}
.cg .ga{margin:10px 0}
.gt{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px}
.gt span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cg .gb{height:6px}.cg .gb i{width:12px;height:12px}
.cg .gl{font-size:11.5px;margin:6px 0 0}
.rt{border-top:1px solid var(--line);padding:14px 0;display:flex;gap:14px;align-items:center;justify-content:space-between}
.rt:first-of-type{border-top:0}
.rt b{display:block;font-size:15px;line-height:1.4}
.rt span{font-size:13px;color:var(--muted)}
.rt .pi{width:68px;height:68px;flex:none;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:12px}
.rt .pt{flex:1;min-width:0}
.rt .pt>span:first-child{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.rt a{flex:none;font-size:14px;font-weight:700;color:var(--on-accent);background:var(--accent);padding:10px 14px;border-radius:10px;text-decoration:none}
.cnt{display:none;align-items:baseline;gap:6px;justify-content:center;background:var(--soft);border-radius:999px;padding:9px 16px;margin-bottom:22px}
.cnt.on{display:flex}
.cnt b{font-size:15px;color:var(--accent);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:14px}
.chip small{display:block;color:var(--muted);font-size:12px}
.radar{display:block;width:100%;max-width:380px;margin:0 auto}
.radar text{fill:var(--text);font-size:13px;font-weight:500;font-family:inherit}
.radar .ring{fill:none;stroke:var(--line)}
.radar .val{fill:var(--accent);fill-opacity:.26;stroke:var(--accent);stroke-width:2}
.card-img{display:block;width:100%;max-width:300px;margin:0 auto 12px;border-radius:12px;border:1px solid var(--line)}
input[type=text]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px;margin:8px 0}
label.ck{display:flex;gap:8px;font-size:13px;color:var(--muted);align-items:flex-start}
.mt{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.mt div{display:flex;width:100%;max-width:560px}
.mt a{line-height:1.5;flex:1;text-align:center;padding:10px 0 9px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
.mt a.on{color:var(--text)}
.mt i{display:block;width:22px;height:22px;margin:0 auto 2px;border-radius:7px;background:currentColor;opacity:.9}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
</style>
</head>

function track(n, d){
  d = d || {}; var p = Object.assign({event:n}, UTM, d);
  try{ window.dataLayer = window.dataLayer || []; window.dataLayer.push(p); }catch(e){}
  try{ if(window.gtag) window.gtag("event", n, d); }catch(e){}
  try{ if(window.fbq) window.fbq("trackCustom", n, d); }catch(e){}
  var EV = {quiz_start:"quiz_start", quiz_complete:"quiz_done", kakao_click:"kakao_click", kakao_unlock:"kakao_unlock"};
  if(EV[n]){ try{ fetch("/api/event", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({e:EV[n]}), keepalive:true}).catch(function(){}); }catch(e){} }
  if(ANALYTICS_ENDPOINT){ try{ navigator.sendBeacon(ANALYTICS_ENDPOINT, JSON.stringify(p)); }catch(e){} }
}
function utmUrl(u, key){
  if(!u || u === "#") return "#";
  var q = Object.keys(UTM).map(function(k){ return k + "=" + encodeURIComponent(UTM[k]); });
  q.push("skin_type=" + key);
  return u + (u.indexOf("?") < 0 ? "?" : "&") + q.join("&");
}
document.addEventListener("click", function(e){
  var a = e.target.closest ? e.target.closest("[data-ev]") : null;
  if(a) track(a.getAttribute("data-ev"), {type:a.getAttribute("data-t")||"", item:a.getAttribute("data-i")||""});
});

function paintCounter(){
  var el = document.getElementById("cnt");
  if(!el || ST.total === null) return;
  el.classList.add("on");
  if(!ST.total){ el.innerHTML = '<span class="muted" style="margin:0">첫 번째 진단자가 되어보세요</span>'; return; }
  var n = document.getElementById("cn"), to = ST.total, t0 = performance.now();
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches){ n.textContent = to.toLocaleString("ko-KR"); return; }

}

function calc(withC){
  var s = {od:[0,0], sr:[0,0], pn:[0,0], wt:[0,0]};
  Q.forEach(function(q,i){ if(S.a[i] != null){ s[q[0]][0] += S.a[i]; s[q[0]][1] += 3; } });
  if(withC) C.forEach(function(q,i){ if(S.c[i] != null){ s[q[0]][0] += 2 * S.c[i]; s[q[0]][1] += 6; } });
  var p = {};
  for(var k in s) p[k] = s[k][1] ? Math.round(s[k][0] / s[k][1] * 100) : 0;
  var od = p.od < TH.od[0] ? "D" : p.od < TH.od[2] ? "C" : "O";
  var lean = od === "C" ? (p.od < TH.od[1] ? "D" : "O") : "";
  var code = od + (p.sr >= TH.sr ? "S" : "R") + (p.pn >= TH.pn ? "P" : "N") + (p.wt >= TH.wt ? "W" : "T");
  var bd = {od:[TH.od[0], TH.od[2]], sr:[TH.sr], pn:[TH.pn], wt:[TH.wt]}, acc = {};
  for(var q in p){
    var d = Math.min.apply(null, bd[q].map(function(b){ return Math.abs(p[q] - b); }));
    acc[q] = Math.round(CEIL[q][withC ? 0 : 1] * (0.78 + 0.22 * Math.min(1, d / 20)));
  }
  return {p:p, acc:acc, code:code, lean:lean, label:code + (lean ? "-" + lean : "")};
}

function radar4(p){

  var h = '<svg class="radar" viewBox="0 0 380 300" role="img" aria-label="피부 레이더 차트">';
  [25,50,75,100].forEach(function(l){ h += '<polygon class="ring" points="' + P(l).map(function(q){ return q.join(","); }).join(" ") + '"/>'; });
  P(100).forEach(function(q){ h += '<line class="ring" x1="' + cx + '" y1="' + cy + '" x2="' + q[0] + '" y2="' + q[1] + '"/>'; });
  h += '<polygon class="val" points="' + P(ks.map(function(k){ return Math.max(8, p[k]); })).map(function(q){ return q.join(","); }).join(" ") + '"/>';
  h += '<text x="' + cx + '" y="' + (cy - R - 14) + '" text-anchor="middle">' + GT.od + ' ' + p.od + '</text>';
  h += '<text x="' + cx + '" y="' + (cy + R + 28) + '" text-anchor="middle">' + GT.pn + ' ' + p.pn + '</text>';
  h += '<text x="' + (cx + R + 16) + '" y="' + (cy - 2) + '" text-anchor="start">' + GT.sr + '<tspan x="' + (cx + R + 16) + '" dy="16">' + p.sr + '</tspan></text>';
  h += '<text x="' + (cx - R - 16) + '" y="' + (cy - 2) + '" text-anchor="end">' + GT.wt + '<tspan x="' + (cx - R - 16) + '" dy="16">' + p.wt + '</tspan></text>';
  return h + '</svg>';
}

  try{ localStorage.setItem("skinside_result", JSON.stringify({key:key, desc:lineDesc(R), p:R.p, t:Date.now()})); }catch(e){}
  if(!S.shown){ S.shown = true; track("quiz_complete", {type:key, simple:S.simple ? 1 : 0}); }
  var tsum = 0; for(var k2 in ST.types) tsum += ST.types[k2];
  var same = (tsum >= 10 && ST.types[key]) ? Math.round(ST.types[key] / tsum * 100) : 0;
  var h = '<p class="muted">수고하셨어요. 이제 스킨케어는 결과 보고 하셔도 돼요.</p><div class="nick">내 피부타입은</div><div class="code">' + key + '</div>';
  if(same) h += '<p class="muted">진단한 사람 중 ' + same + '%가 나와 같은 타입이에요.</p>';
  h += '<div class="box">';
  L.forEach(function(c){ h += '<div class="lr"><span class="tag">' + c + '</span><div><b>' + LET[c][0] + '</b><span>' + LET[c][1] + '</span></div></div>'; });
  if(R.lean) h += '<p class="muted" style="margin:10px 0 0">- ' + R.lean + ' 는 ' + (R.lean === "O" ? "지성" : "건성") + '에 가까운 복합성이라는 뜻이에요.</p>';
  h += '</div><div class="box"><b>내 피부 성향</b>' + radar4(R.p) + '<div class="cg">' + gauge("od", R.p.od, R.acc.od) + gauge("sr", R.p.sr, R.acc.sr) + gauge("pn", R.p.pn, R.acc.pn) + gauge("wt", R.p.wt, R.acc.wt) + '</div></div>';
  if(S.simple) h += '<div class="box muted">간이 진단이라 정밀도가 낮아요. 세안 후 30분 동안 아무것도 바르지 않고 기다리면 더 정확하게 알 수 있어요.</div>';
  var needCalm = (L[1] === "S" || S.a[12] >= 2), needVit = (L[3] === "W" || L[2] === "P"), black = (S.a[7] >= 2);
  if(!needCalm && !needVit){ if(R.p.sr >= Math.max(R.p.pn, R.p.wt)) needCalm = true; else needVit = true; }
  var tip = TIP[L[0]] + (L[1] === "S" ? " " + TIP.S : "") + (L[3] === "W" ? " " + TIP.W : (L[2] === "P" ? " " + TIP.P : ""));
  var calmFirst = needCalm && (!needVit || R.p.sr >= Math.max(R.p.pn, R.p.wt));
  var one = calmFirst ? "붉어짐과 트러블을 완화시켜주는 진정 앰플 사용을 적극 추천해요."
    : (L[3] === "W" ? "주름과 색소 자국 관리에 도움을 주는" : "색소 자국과 칙칙함 관리에 도움을 주는") + " 미백·주름 기능성 앰플 사용을 적극 추천해요.";
  h += '<div class="box"><b>문장군의 한마디</b><p style="margin:6px 0 8px">' + tip + '</p><p style="margin:0">' + one + '</p></div>';
  var r = [["세안", PR.cl, "세안제는 이 제품으로 시작하세요."]];
  if(calmFirst) r.push(["앰플", PR.calm, "진정이 필요한 타입이라 추천해요."]);
  else r.push(["앰플", PR.vit, "미백과 주름 개선이 필요한 타입이라 추천해요."]);
  r.push(["올인원·크림", PR.minic, "세안 후 3분 안에 발라주세요."]);
  r.push(["선케어", PR.sun, "아침마다 꼭 챙기세요."]);
  if(black) r.push(["블랙헤드 케어", PR.patch, "모공과 블랙헤드가 신경 쓰이는 타입이라 추천해요."]);
  h += '<div class="box"><b>추천 루틴</b>';
  r.forEach(function(x){ h += '<div class="rt"><img class="pi" src="' + x[1].img + '" alt=""><div class="pt"><span>' + x[0] + '</span><b>' + x[1].n + '</b><span>' + x[2] + '</span></div><a href="' + utmUrl(x[1].url, key) + '" target="_blank" rel="noopener" data-ev="buy_click" data-t="' + key + '" data-i="' + x[1].n + '">구매하기</a></div>'; });
  h += '</div><a class="btn" href="' + utmUrl(LINKS.store, key) + '" target="_blank" rel="noopener" data-ev="store_click" data-t="' + key + '">족보템 구매하기</a>'
     + '<div class="box" style="margin-top:18px"><b>결과 카드</b><p class="muted">인스타 스토리에 올려보세요. 친구들은 어떤 타입인지 물어봐도 좋아요.</p>'
     + '<img class="card-img" id="card" alt="내 피부타입 결과 카드"><button class="btn small" id="sv">이미지 저장</button><button class="btn ghost small" id="sh" style="display:none">공유하기</button>'
     + '<p class="note" style="margin-top:8px">저장이 안 되면 이미지를 길게 눌러 저장하세요.</p></div>'
     + '<button class="link" id="rs">다시 진단하기</button>'
     + '<p class="note">이 결과는 바우만 피부타입 분류(BSTI)를 바탕으로 한 참고용 가이드이며 의학적 진단이 아닙니다. 피부 질환이 의심되면 피부과 진료를 받으세요.</p>';
  $(h);
  document.getElementById("rs").onclick = reset;
  var blob = null;
  makeCard(R, function(cv){
    document.getElementById("card").src = cv.toDataURL("image/png");
    cv.toBlob(function(b){
      blob = b;
      try{ var f = new File([b], "skinside-result.png", {type:"image/png"}); if(navigator.canShare && navigator.canShare({files:[f]})) document.getElementById("sh").style.display = "block"; }catch(e){}
    }, "image/png");
  });
  document.getElementById("sv").onclick = function(){
    if(!blob) return; if(!DL){ var u = URL.createObjectURL(blob), a = document.createElement('a'); a.href = u; a.download = 'skinside-result.png'; document.body.appendChild(a); a.click(); a.remove(); track('card_save', {type:key}); return; }
    DL.save({filename:"skinside-result.png", data:blob}).then(function(){ track("card_save", {type:key}); }).catch(function(){});
  };
  document.getElementById("sh").onclick = function(){
    try{ navigator.share({files:[new File([blob], "skinside-result.png", {type:"image/png"})]}).then(function(){ track("card_share", {type:key}); }).catch(function(){}); }catch(e){}
  };
}

/* 결과 카드 이미지 (1080x1920) */
function fitFont(c, txt, max, min, w, wt, F){
  var s = max;
  while(s > min){ c.font = wt + " " + s + "px " + F; if(c.measureText(txt).width <= w) break; s -= 4; }
}
function makeCard(R, cb){
  var cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1920;
  var c = cv.getContext("2d"), F = '"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
  var ks = ["od","sr","pn","wt"];
  c.fillStyle = "#4E57A2"; c.fillRect(0, 0, 1080, 1920);
  c.fillStyle = "rgba(255,255,255,.07)"; c.fillRect(0, 1730, 1080, 190);
  var lg = document.getElementById("lg");
  try{ var w = 600, hh = w * lg.naturalHeight / lg.naturalWidth; c.drawImage(lg, (1080 - w) / 2, 150, w, hh); }catch(e){}
  c.fillStyle = "#fff"; c.textAlign = "center";
  c.font = "500 42px " + F; c.fillText("내 피부타입은", 540, 405);
  fitFont(c, R.label, 170, 80, 900, "800", F); c.fillText(R.label, 540, 590);
  fitFont(c, lineDesc(R), 44, 28, 900, "600", F); c.fillStyle = "rgba(255,255,255,.88)"; c.fillText(lineDesc(R), 540, 660);
  var cx = 540, cy = 1015, Rr = 225;
  function pt(i, v){ var a = -Math.PI / 2 + i * Math.PI / 2; return [cx + Rr * v / 100 * Math.cos(a), cy + Rr * v / 100 * Math.sin(a)]; }
  c.strokeStyle = "rgba(255,255,255,.35)"; c.lineWidth = 2;
  [25,50,75,100].forEach(function(l){ c.beginPath(); for(var i = 0; i < 4; i++){ var q = pt(i, l); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); } c.closePath(); c.stroke(); });
  for(var i = 0; i < 4; i++){ var e = pt(i, 100); c.beginPath(); c.moveTo(cx, cy); c.lineTo(e[0], e[1]); c.stroke(); }
  c.beginPath(); ks.forEach(function(k,i){ var q = pt(i, Math.max(8, R.p[k])); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }); c.closePath();
  c.fillStyle = "rgba(255,255,255,.35)"; c.fill(); c.strokeStyle = "#fff"; c.lineWidth = 5; c.stroke();
  c.fillStyle = "#fff"; c.font = "600 36px " + F;
  c.textAlign = "center"; c.fillText(GT.od, 540, cy - Rr - 34); c.fillText(GT.pn, 540, cy + Rr + 62);
  c.textAlign = "left"; c.fillText(GT.sr, cx + Rr + 26, cy + 12);
  c.textAlign = "right"; c.fillText(GT.wt, cx - Rr - 26, cy + 12);
  for(var j = 0; j < 4; j++){
    var y = 1440 + j * 64, k = ks[j];
    c.textAlign = "left"; c.fillStyle = "#fff"; c.font = "600 30px " + F; c.fillText(GT[k], 110, y + 10);
    c.fillStyle = "rgba(255,255,255,.3)"; c.fillRect(340, y, 620, 8);
    c.fillStyle = "#fff"; c.beginPath(); c.arc(340 + 620 * Math.max(4, Math.min(96, R.p[k])) / 100, y + 4, 12, 0, 7); c.fill();
    c.fillStyle = "rgba(255,255,255,.75)"; c.font = "500 22px " + F; c.fillText(GA[k][0], 340, y + 34);
    c.textAlign = "right"; c.fillText(GA[k][1], 960, y + 34);
  }
  c.textAlign = "center"; c.fillStyle = "#fff";
  c.font = "800 52px " + F; c.fillText("피부타입 집에서 진단", 540, 1810);
  c.font = "500 38px " + F; c.fillStyle = "rgba(255,255,255,.85)"; c.fillText(SHARE_TEXT, 540, 1872);
  cb(cv);
}

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="referrer" content="no-referrer"><title>파트너 브랜드</title>
<style>
:root{--pri:#4E57A2;--pri-soft:#eceef8;--ink:#191f28;--mute:#6b7684;--line:#e5e8eb;--bg:#f2f4f6;--card:#fff;--red:#f04452;--ok:#12b886}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{background:var(--pri);color:#fff;padding:16px max(16px,env(safe-area-inset-left,0px))}
header b{font-size:17px;display:block}header span{opacity:.85;font-size:13px}
main{max-width:760px;margin:0 auto;padding:14px 16px 60px}
.help{background:#fff8e6;color:#8a5a00;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{font:inherit;font-weight:700;border:0;background:var(--card);color:#4e5968;padding:9px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff}
.o{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}
.o.x{opacity:.65}
.h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:700}
.st{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--pri-soft);color:var(--pri)}
.st.c{background:#fde8ea;color:var(--red)}.st.d{background:#e3f8f0;color:var(--ok)}
.it{margin:10px 0;padding:10px 12px;background:#f9fafb;border-radius:10px}
.s{color:var(--mute);font-size:13px}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,input{font:inherit;padding:10px 11px;border:1px solid #d1d6db;border-radius:10px;background:#fff;color:var(--ink)}
input{flex:1;min-width:150px}
button.sv{font:inherit;font-weight:700;border:0;background:var(--pri);color:#fff;padding:10px 18px;border-radius:10px;cursor:pointer}
.msg{margin-top:6px;font-size:13px;font-weight:700}.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.empty{text-align:center;color:var(--mute);padding:40px 0}
#lg{max-width:340px;margin:80px auto;padding:0 20px;text-align:center}

header{display:flex;align-items:center;gap:12px}header>div{flex:1}
header button{font:inherit;font-weight:700;border:0;background:rgba(255,255,255,.18);color:#fff;padding:7px 12px;border-radius:9px;cursor:pointer}
.big{background:var(--pri);color:#fff;border-radius:18px;padding:20px;margin-bottom:12px}.big.late{background:#c92a2a}.big.zero{background:#12b886}
.big small{opacity:.85;font-size:13px}.big b{display:block;font-size:34px;line-height:1.2}.big a{color:#fff;font-weight:700;text-decoration:underline;cursor:pointer}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.kpi div{background:var(--card);border-radius:16px;padding:14px}.kpi small{display:block;color:var(--mute);font-size:12.5px}.kpi b{font-size:24px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px}.card h2{margin:0 0 4px;font-size:16px}.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.go{float:right;font-size:13px;font-weight:700;color:var(--pri);text-decoration:none;cursor:pointer}
.wk{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11.5px;color:var(--mute)}.wk i{display:block;width:100%;background:var(--pri);border-radius:6px 6px 0 0;min-height:3px}.wk b{font-size:12px;color:var(--ink);margin-bottom:2px}
.rw{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.rw:first-of-type{border-top:0}.rw b{font-variant-numeric:tabular-nums}
.lgp{max-width:360px;margin:70px auto;padding:20px;background:var(--card);border-radius:18px}.lgp h2{margin:0 0 4px;text-align:center}
.lgp input{width:100%;text-align:center;font-size:18px;letter-spacing:.08em;margin-top:12px}.lgp button{width:100%;margin-top:12px;padding:13px}
.tk{border-top:1px solid var(--line);padding:10px 0}.ms{margin:6px 0;padding:8px 11px;border-radius:10px;background:#f2f4f6;font-size:13px;white-space:pre-wrap}.ms.p{background:var(--pri-soft)}.ms small{display:block;color:var(--mute)}
.bt2{font:inherit;font-weight:700;border:1px solid #d1d6db;background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}.bt2.red{color:var(--red)}
textarea{font:inherit;width:100%;min-height:80px;padding:10px;border:1px solid #d1d6db;border-radius:10px}
.al{display:inline-block;background:#fde8ea;color:var(--red);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin:2px 4px 2px 0}
a.dl{display:inline-block;text-decoration:none;font-weight:700;background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px}
/* ===== 스킨인사이드 운영 화면 테마: 터미널형 대시보드 (다크 전용, 스킨인사이드 인디고) ===== */
:root{--pri:#5560ea;--pri-soft:#1b2052;--ink:#eceef8;--mute:#8b91ab;--line:#252840;--bg:#0a0b11;--card:#10121b;--card2:#151827;--red:#ff6577;--ok:#35f0b0;--warn:#ffb54a;--warn-bg:#2a2010;--neon:#8d98ff;--neon-glow:none;--glow:0 0 0 1px var(--neon);--hd:#0a0b11;--ok-bg:#0d2a22;--red-bg:#33121a;--inp:#0b0c14;color-scheme:dark;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;}
body{background:var(--bg);color:var(--ink);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
/* 머리글 */
header{background:var(--hd)!important;color:var(--ink)!important;border-bottom:1px solid var(--line);padding:13px max(16px,env(safe-area-inset-left,0px))!important;gap:12px}
header b{display:flex!important;align-items:center;gap:10px;font-size:15px!important;font-weight:800;letter-spacing:.01em}
header b:before{content:"S";display:inline-grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--neon);color:#fff;font-family:var(--mono);font-weight:800;box-shadow:var(--neon-glow)}
header span{color:var(--mute)!important;font-size:12px!important;opacity:1!important}
header button{border:1px solid var(--line)!important;background:transparent!important;color:var(--ink)!important;border-radius:8px!important;padding:7px 12px!important;font-size:13px}
header button:hover{border-color:var(--neon)!important;box-shadow:var(--glow)}
/* 탭 */
nav,#tb .tabs{border-bottom:1px solid var(--line);max-width:none!important;margin:0!important;padding:0 max(16px,env(safe-area-inset-left,0px))!important;gap:2px!important;background:var(--hd);overflow-x:auto;scrollbar-width:none}
nav button,#tb .tabs button{border-radius:0!important;background:transparent!important;color:var(--mute)!important;padding:13px 16px!important;border-bottom:2px solid transparent!important;font-weight:700;white-space:nowrap}
nav button:hover,#tb .tabs button:hover{color:var(--ink)!important}
nav button.on,#tb .tabs button.on{color:var(--neon)!important;border-bottom-color:var(--neon)!important;text-shadow:var(--neon-glow)}
#tb .tabs{display:flex;margin-bottom:0!important}
main{max-width:1040px!important}
/* 카드: 얇은 테두리, 작은 모서리 */
.card,.o,.o2,.kpi div,.big,.lgp,.tk{border:1px solid var(--line);border-radius:10px!important;background:var(--card)}
.card h2,.lgp h2{font-size:15px!important;font-weight:800;display:flex;align-items:center;gap:8px}
.card h2:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--neon);box-shadow:var(--neon-glow)}
.lgp h2:before{display:none}
.sub,.s{color:var(--mute)}
.go{color:var(--neon)!important;text-shadow:var(--neon-glow);font-family:var(--mono);font-size:12px!important}
/* 핵심 지표: 칸으로 이어 붙인 표 */
.kpi{gap:0!important;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--line);gap:1px!important}
.kpi div{border:0!important;border-radius:0!important;background:var(--card)!important;padding:14px 16px!important}
.kpi small{font-size:11.5px!important;letter-spacing:.04em;color:var(--mute)}
.kpi b{font-family:var(--mono);font-size:24px!important;font-weight:700;letter-spacing:-.02em;color:var(--ink);text-shadow:var(--glow)}
.kpi b{text-shadow:none}
.up{color:var(--ok)!important;font-family:var(--mono)}.dn{color:var(--red)!important;font-family:var(--mono)}
/* 처리할 일 / 안내 */
.todo{border:1px solid var(--warn);background:var(--warn-bg)!important;color:var(--warn)!important;border-radius:10px!important}
.todo.ok{border-color:var(--ok);background:var(--ok-bg)!important;color:var(--ok)!important;box-shadow:var(--glow)}
.todo a{background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line);border-radius:8px!important}
.todo a:hover{border-color:var(--neon);box-shadow:var(--glow)}
.todo a i{background:var(--red)!important;color:#fff;font-family:var(--mono)}
.note,.help{background:var(--warn-bg)!important;color:var(--warn)!important;border:1px solid var(--line);border-radius:10px!important}
.big{background:var(--card)!important;color:var(--ink)!important;border-color:var(--neon);box-shadow:var(--glow);position:relative}
.big b{font-family:var(--mono);color:var(--neon);text-shadow:var(--neon-glow)}
.big small,.big a{color:var(--mute)!important}.big a{color:var(--neon)!important;text-shadow:var(--neon-glow)}
.big.late{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}.big.late b{color:var(--red);text-shadow:none}
.big.zero{border-color:var(--ok)}.big.zero b{color:var(--ok)}
/* 흐름 막대, 점, 태그 */
.flow,.seg,.bars .tr,.tp .tr{background:var(--pri-soft)!important;border-radius:6px!important}
.f1,.c0{background:var(--pri)!important;box-shadow:var(--glow)}.f2{background:#0aa774!important}.f3{background:#7a8099!important}
.bars .tr i,.tp .tr i{background:var(--neon)!important;box-shadow:var(--neon-glow)}
.bars .rk,.tp code,.code{font-family:var(--mono);color:var(--neon)!important}
.code{text-shadow:var(--neon-glow)}
.dot{background:var(--ok)!important;box-shadow:none}.dot.w{background:var(--warn)!important;box-shadow:none}.dot.r{background:var(--red)!important;box-shadow:none}.dot.g{background:var(--mute)!important;box-shadow:none}
.tag,.st{background:var(--pri-soft)!important;color:var(--neon)!important;border:1px solid var(--line);border-radius:6px!important;font-family:var(--mono);font-size:11.5px!important}
.tag.w{background:var(--warn-bg)!important;color:var(--warn)!important}.tag.r,.st.c{background:var(--red-bg)!important;color:var(--red)!important}.st.d{background:var(--ok-bg)!important;color:var(--ok)!important}
.okc{color:var(--ok)!important}.wn{color:var(--red)!important}
/* 표 */
.tbl th,.rw .s,.tbl td{border-color:var(--line)!important}.tbl th{font-size:11.5px!important;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.tbl td.r,.tbl th.r,.rw b,.wk b,.bt span,.bars .n,.tp span{font-family:var(--mono)}
.bt,.rw,.bars li,.pl,.o2 .br,.ax,.tk{border-color:var(--line)!important}
/* 입력과 버튼 */
input,select,textarea{background:var(--inp)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:focus,select:focus,textarea:focus{outline:none!important;border-color:var(--neon)!important;box-shadow:var(--glow)}
button.pri,button.sm,button.sv,.big+.x{background:var(--pri)!important;color:#fff!important;border-radius:8px!important}
button.pri:hover,button.sm:hover,button.sv:hover{box-shadow:var(--glow);filter:brightness(1.08)}
button.g,.bt2,button.del,.more,.chips button,a.dl{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important}
button.g,.bt2:not(.red),.more{color:var(--neon)!important}
a.dl{background:var(--pri)!important;color:#fff!important;border-color:transparent!important}
button.del,.bt2.red{color:var(--red)!important;border-color:var(--red)!important}
button.g:hover,.bt2:hover,.chips button:hover,.more:hover{border-color:var(--neon)!important;box-shadow:var(--glow)}
.chips button.on{background:var(--pri-soft)!important;color:var(--neon)!important;border-color:var(--neon)!important;box-shadow:var(--glow);text-shadow:var(--neon-glow)}
.drop{background:var(--card2)!important;border-color:var(--line)!important;border-radius:10px!important}
.drop .pv,.pl img{background:var(--card2)!important;border-color:var(--line)!important}
.newc{background:var(--pri-soft)!important;border:1px solid var(--neon);box-shadow:var(--glow);border-radius:10px!important}
.it,.ms{background:var(--card2)!important;border:1px solid var(--line);border-radius:8px!important}.ms.p{background:var(--pri-soft)!important}
.al{background:var(--red-bg)!important;color:var(--red)!important;border-radius:6px!important}
.msg.e{color:var(--red)}.msg.o{color:var(--ok)}
.wk i{background:var(--neon)!important;box-shadow:var(--neon-glow);border-radius:4px 4px 0 0!important}.wk b{color:var(--ink)}
.empty{color:var(--mute)}
.demo{background:var(--warn-bg)!important;color:var(--warn)!important}
/* 라벨(작은 대문자 느낌) */
label{font-size:12px!important;letter-spacing:.03em;color:var(--mute)}
/* 본문 안의 하위 탭 (발송 대기 / 완료 / 취소) */
main .tabs{display:flex;gap:6px;flex-wrap:wrap}
main .tabs button{background:transparent!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:8px!important;padding:8px 14px}
main .tabs button:hover{border-color:var(--neon)!important}
main .tabs button.on{background:var(--pri-soft)!important;color:var(--neon)!important;border-color:var(--neon)!important}
/* 표와 공통 부품 (파트너 페이지에서도 사용) */
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}.tbl th,.tbl td{padding:9px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap}.tbl td.r,.tbl th.r{text-align:right}.tw{overflow-x:auto}
.tbl tr.tot td{font-weight:800;background:var(--card2)}
.tbl a.ml{color:var(--neon);cursor:pointer;text-decoration:underline;font-weight:700}
.stars{color:#ffc447;letter-spacing:1px;font-size:14px}.stars i{font-style:normal;color:var(--line)}
.cnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.cnt button{font:inherit;text-align:left;background:var(--card)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:10px!important;padding:14px 16px;cursor:pointer}
.cnt button small{display:block;color:var(--mute);font-size:12px}.cnt button b{font-family:var(--mono);font-size:26px}
.cnt button.on{border-color:var(--neon)!important;box-shadow:0 0 0 1px var(--neon)}
.rv{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}.rv.low{border-color:var(--red)}
.rv .rh{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}.rv p{margin:8px 0;white-space:pre-wrap;word-break:break-word}
.bd{display:inline-block;font-size:11.5px;font-weight:800;padding:2px 8px;border-radius:6px;border:1px solid var(--line);margin-right:4px;font-family:var(--mono)}
.bd.n{color:var(--neon);border-color:var(--neon)}.bd.l{color:var(--red);border-color:var(--red)}.bd.b{color:var(--warn);border-color:var(--warn)}
.cnt a.cb{display:block;text-decoration:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cnt a.cb small{display:block;color:var(--mute);font-size:12px}.cnt a.cb b{font-family:var(--mono);font-size:26px}
</style></head>
<body>
<header id="hd"></header>
<div id="tb"></div>
<main id="m"></main>
<script>
var M = document.getElementById("m"), HD = document.getElementById("hd"), TAB = "home", DATA = null, BN = "";
var CAR = {cj:"CJ대한통운", lotte:"롯데택배", hanjin:"한진택배", post:"우체국", logen:"로젠택배"};
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ return Number(v || 0).toLocaleString("ko-KR"); }
function api(p, o){ o = o || {}; o.credentials = "same-origin"; return fetch(p, o).then(function(r){ return r.json().then(function(j){ if(r.status === 401){ login(true); throw new Error("auth"); } if(!r.ok) throw new Error(j.error || "오류"); return j; }); }); }
function kst(iso){ var d = new Date(new Date(iso).getTime() + 9 * 36e5); return d.toISOString().slice(0, 16).replace("T", " "); }

/* ---------- 로그인: 브랜드별 접속 코드 ---------- */
function boot(){ api("/api/partner/me").then(function(j){ BN = j.brand; shell(); }).catch(function(e){ if(e.message !== "auth") login(false); }); }
function login(bad){
  HD.innerHTML = ""; document.getElementById("tb").innerHTML = "";
  M.innerHTML = '<div class="lgp"><h2>파트너 브랜드</h2><p class="s" style="text-align:center;margin:0">스킨인사이드가 알려드린 접속 코드를 입력해주세요.</p><input id="cd" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="sv" id="go">들어가기</button><div class="msg e" id="lm">' + (bad ? "다시 로그인해주세요." : "") + '</div></div>';
  var go = function(){ var b = document.getElementById("go"), m = document.getElementById("lm"); b.disabled = true; m.textContent = "";
    fetch("/api/partner/login", {method:"POST", credentials:"same-origin", headers:{"content-type":"application/json"}, body:JSON.stringify({code:document.getElementById("cd").value})})
      .then(function(r){ return r.json().then(function(j){ if(!r.ok) throw new Error(j.error || "오류"); return j; }); }).then(function(j){ BN = j.brand; shell(); }).catch(function(e){ b.disabled = false; m.textContent = e.message; }); };
  document.getElementById("go").onclick = go; document.getElementById("cd").onkeydown = function(e){ if(e.key === "Enter") go(); };
}
function shell(){
  if(window.STKT){ clearInterval(window.STKT); window.STKT = null; }
  HD.innerHTML = '<div><b>' + esc(BN) + '</b><span>SKININSIDE PARTNER</span></div><button id="lo">로그아웃</button>'; document.getElementById("lo").onclick = function(){ fetch("/api/partner/logout", {method:"POST", credentials:"same-origin"}).then(function(){ login(false); }); };
  document.getElementById("tb").innerHTML = '<div class="tabs" style="max-width:760px;margin:12px auto 0;padding:0 16px">' + [["home", "홈"], ["orders", "발송"], ["stock", "재고"], ["review", "리뷰"], ["cs", "CS"], ["settle", "정산"]].map(function(t){ return '<button data-t="' + t[0] + '" class="' + (TAB === t[0] ? "on" : "") + '">' + t[1] + '</button>'; }).join("") + '</div>';
  [].forEach.call(document.querySelectorAll("#tb button"), function(b){ b.onclick = function(){ go(b.dataset.t); }; });
  ({home:home, orders:orders, stock:stock, review:review, cs:cs, settle:settle}[TAB] || home)();
}
function go(t){ TAB = t; try{ history.replaceState(null, "", "#" + t); }catch(e){} shell(); window.scrollTo(0, 0); }
function links(){ [].forEach.call(M.querySelectorAll("[data-go]"), function(a){ a.onclick = function(e){ e.preventDefault(); if(a.dataset.rf) RF = a.dataset.rf; go(a.dataset.go); }; }); }

/* ---------- 홈: 읽기 전용 요약 ---------- */
function home(){
  M.innerHTML = '<div class="empty">불러오는 중...</div>';
  api("/api/partner/home").then(function(d){
    var c = d.counts, mx = Math.max.apply(null, d.week.map(function(x){ return x.n; }).concat([1]));
    var h = c.todo ? '<div class="big' + (d.late ? " late" : "") + '"><small>오늘 발송할 주문</small><b>' + c.todo + '건</b><small>' + (d.late ? "발송이 늦어진 주문 " + d.late + "건이 있어요. 가장 오래된 주문은 " + d.oldestHours + "시간째 기다려요. " : "") + '<a data-go="orders">발송하러 가기 →</a></small></div>'
      : '<div class="big zero"><small>오늘 발송할 주문</small><b>없어요</b><small>들어온 주문을 모두 발송했어요.</small></div>';

}

    window.STKT = setInterval(function(){ if(TAB !== "stock"){ clearInterval(window.STKT); return; } api("/api/partner/stock").then(function(x){ var a = document.getElementById("sk-s"); if(!a) return; a.textContent = x.selling; document.getElementById("sk-o").textContent = x.soldOut; document.getElementById("sk-t").textContent = kst(x.at).slice(11); x.products.forEach(function(p){ var e = document.querySelector('[data-st="' + p.id + '"]'); if(e){ e.className = "st " + (p.soldOut ? "c" : "d"); e.textContent = p.soldOut ? "품절" : "판매 중"; } }); }).catch(function(){}); }, 15000);
    var post = function(id, body){ api("/api/partner/stock", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(Object.assign({id:id}, body))}).then(stock).catch(function(e){ if(e.message !== "auth"){ var m = M.querySelector('[data-sm="' + id + '"]'); m.className = "msg e"; m.textContent = e.message; } }); };
    [].forEach.call(M.querySelectorAll("[data-sq]"), function(b){ b.onclick = function(){ var v = M.querySelector('[data-q="' + b.dataset.sq + '"]').value.trim(); post(b.dataset.sq, {qty:v === "" ? null : Number(v)}); }; });
    [].forEach.call(M.querySelectorAll("[data-so]"), function(b){ b.onclick = function(){ post(b.dataset.so, {soldOut:b.dataset.v === "1"}); }; });
  }).catch(function(e){ if(e.message !== "auth") M.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

/* ---------- 리뷰: 직접 삭제는 못 하고 삭제 요청만 가능 ---------- */
var RF = "new";
function stars(n){ var s = ""; for(var i = 1; i <= 5; i++) s += i <= n ? "★" : "<i>★</i>"; return '<span class="stars">' + s + '</span>'; }
function review(){
  M.innerHTML = '<div class="empty">불러오는 중...</div>';
  api("/api/partner/reviews").then(function(j){
    var c = j.counts, L = j.reviews, bestCnt = {};
    L.forEach(function(r){ if(r.best) bestCnt[r.productId] = (bestCnt[r.productId] || 0) + 1; });
    var list = L.filter(function(r){ return RF === "new" ? r.isNew : RF === "low" ? r.low : RF === "del" ? (r.delReq && r.delReq.status === "pending") : true; });
    var h = '<div class="cnt"><button data-rf="new" class="' + (RF === "new" ? "on" : "") + '"><small>새 리뷰</small><b>' + c.new + '</b></button><button data-rf="low" class="' + (RF === "low" ? "on" : "") + '"><small>낮은 평점 (2점 이하)</small><b>' + c.low + '</b></button><button data-rf="del" class="' + (RF === "del" ? "on" : "") + '"><small>삭제 요청 중</small><b>' + c.delReq + '</b></button></div>';
    h += '<div class="help">리뷰는 직접 삭제할 수 없어요. 악의적인 리뷰는 삭제 요청을 보내면 스킨인사이드가 확인해서 승인하면 삭제돼요. 낮은 평점 리뷰도 마찬가지예요. 베스트 리뷰는 제품마다 3개까지, 별점 4점 이상 리뷰로 골라요. 소비자 화면 맨 위에 보여요.</div>';
    h += (RF !== "all" ? '<div class="f" style="margin:0 0 10px"><button class="sv" data-rf="all">전체 리뷰 보기 (' + c.total + ')</button>' + (RF === "new" && c.new ? '<button class="bt2" id="rall">모두 확인했어요</button>' : '') + '</div>' : '<div class="s" style="margin-bottom:8px">전체 리뷰 · 최신순 ' + c.total + '건</div>');
    h += list.length ? list.map(function(r){
      var d = r.delReq, dl = d ? (d.status === "pending" ? '<span class="bd b">삭제 요청 중</span>' : d.status === "rejected" ? '<span class="bd">삭제 요청 거부됨</span>' : "") : "";
      return '<div class="rv' + (r.low ? " low" : "") + '"><div class="rh"><span>' + stars(r.rating) + ' ' + (r.isNew ? '<span class="bd n">NEW</span>' : '') + (r.low ? '<span class="bd l">낮은 평점</span>' : '') + (r.best ? '<span class="bd b">베스트</span>' : '') + dl + '</span><span class="s">' + esc(kst(r.createdAt)) + '</span></div><div class="s">' + esc(r.productName) + ' · ' + esc(r.userName) + ' · ' + esc(r.orderId) + '</div><p>' + esc(r.text) + '</p>'
        + '<div class="f" style="margin:0">' + (r.rating >= 4 ? '<button class="bt2" data-b="' + esc(r.id) + '" data-on="' + (r.best ? 0 : 1) + '">' + (r.best ? "베스트 해제" : "베스트로 선정 (" + (bestCnt[r.productId] || 0) + "/3)") + '</button>' : '') + (!d ? '<button class="bt2 red" data-q="' + esc(r.id) + '">삭제 요청</button>' : '') + '</div><div data-rq="' + esc(r.id) + '"></div><div class="msg" data-rm="' + esc(r.id) + '"></div></div>';
    }).join("") : '<div class="empty">' + (RF === "new" ? "새 리뷰가 없어요." : RF === "low" ? "낮은 평점 리뷰가 없어요." : RF === "del" ? "삭제 요청 중인 리뷰가 없어요." : "리뷰가 없어요.") + '</div>';
    M.innerHTML = h;
    var say = function(id, t){ var m = M.querySelector('[data-rm="' + id + '"]'); if(m){ m.className = "msg e"; m.textContent = t; } };
    [].forEach.call(M.querySelectorAll("[data-rf]"), function(b){ b.onclick = function(){ RF = b.dataset.rf; review(); }; });
    var ra = document.getElementById("rall"); if(ra) ra.onclick = function(){ api("/api/partner/reviews/read", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ids:"all"})}).then(review); };
    [].forEach.call(M.querySelectorAll("[data-b]"), function(b){ b.onclick = function(){ api("/api/partner/reviews/best", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({id:b.dataset.b, on:b.dataset.on === "1"})}).then(review).catch(function(e){ if(e.message !== "auth") say(b.dataset.b, e.message); }); }; });
    [].forEach.call(M.querySelectorAll("[data-q]"), function(b){ b.onclick = function(){ var id = b.dataset.q, box = M.querySelector('[data-rq="' + id + '"]'); if(box.innerHTML){ box.innerHTML = ""; return; }
      box.innerHTML = '<textarea placeholder="삭제를 요청하는 사유를 적어주세요 (예: 허위 사실, 욕설, 광고)" style="margin-top:8px"></textarea><div class="f"><button class="sv">삭제 요청 보내기</button></div>';
      box.querySelector("button").onclick = function(){ api("/api/partner/reviews/delete-request", {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({id:id, reason:box.querySelector("textarea").value})}).then(review).catch(function(e){ if(e.message !== "auth") say(id, e.message); }); }; }; });
  }).catch(function(e){ if(e.message !== "auth") M.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

/* ---------- CS ---------- */
var TY = {inquiry:"문의", exchange:"교환", return:"반품"}, SS = {open:"답변 대기", answered:"답변 완료", approved:"승인됨", rejected:"거절됨", received:"입고 확인", refunded:"환불 완료", closed:"종료"};
function cs(){
  M.innerHTML = '<div class="empty">불러오는 중...</div>';
  api("/api/partner/cs").then(function(j){
    var act = function(t){ var a = []; if(t.status === "closed" || t.status === "refunded" || t.status === "rejected") return "";
      if(t.type !== "inquiry" && t.status === "open") a.push('<button class="sv" data-a="decide" data-x="approve" data-i="' + t.id + '">승인</button><button class="bt2 red" data-a="decide" data-x="reject" data-i="' + t.id + '">거절</button>');
      if(t.type === "return" && (t.status === "approved" || t.status === "received")) a.push('<button class="sv" data-a="received" data-i="' + t.id + '">반품 입고 확인 · 자동 환불</button>');
      if(t.type === "exchange" && t.status === "approved") a.push('<input data-tr="' + t.id + '" placeholder="교환품 송장번호 (선택)"><button class="sv" data-a="exchange-sent" data-i="' + t.id + '">교환품 발송 완료</button>');
      if(t.type === "inquiry") a.push('<button class="bt2" data-a="close" data-i="' + t.id + '">해결됨으로 종료</button>');
      if(!t.escalated) a.push('<button class="bt2" data-a="escalate" data-i="' + t.id + '">운영자에게 도움 요청</button>');
      return '<textarea data-tx="' + t.id + '" placeholder="고객에게 보낼 답변"></textarea><div class="f"><button class="sv" data-a="reply" data-i="' + t.id + '">답변 보내기</button>' + a.join("") + '</div><div class="msg" data-cm="' + t.id + '"></div>'; };
    M.innerHTML = '<div class="help">반품은 상품이 돌아온 걸 확인하고 "입고 확인"을 누르면 고객에게 자동으로 환불돼요. 따로 환불 처리를 하실 필요가 없어요.</div>' + (j.tickets.length ? j.tickets.map(function(t){
      return '<div class="o"><div class="h"><span>' + TY[t.type] + ' · ' + esc(t.orderId) + '</span><span class="st ' + (t.status === "open" || t.status === "received" ? "c" : "d") + '">' + SS[t.status] + '</span></div><div class="s">' + esc(t.customer.name) + ' / ' + esc(t.customer.phone) + ' · ' + t.items.map(function(l){ return esc(l.name) + ' × ' + l.q; }).join(", ") + (t.refundError ? '<br><b style="color:var(--red)">환불 실패: ' + esc(t.refundError) + ' (운영자가 처리해요)</b>' : '') + '</div>'
        + t.messages.map(function(m){ return '<div class="ms ' + (m.from === "partner" ? "p" : "") + '"><small>' + ({customer:"고객", partner:"우리", admin:"운영자"}[m.from] || m.from) + ' · ' + esc(kst(m.at)) + '</small>' + esc(m.text) + '</div>'; }).join("") + act(t) + '</div>';
    }).join("") : '<div class="empty">CS 요청이 없어요.</div>');
    [].forEach.call(M.querySelectorAll("[data-a]"), function(b){ b.onclick = function(){
      var id = b.dataset.i, a = b.dataset.a, tx = M.querySelector('[data-tx="' + id + '"]'), tr = M.querySelector('[data-tr="' + id + '"]'), body = {id:id, text:tx ? tx.value : "", action:b.dataset.x, tracking:tr ? tr.value : ""};
      if(a === "reply" && tx && tx.value.trim().length < 2){ var m = M.querySelector('[data-cm="' + id + '"]'); m.className = "msg e"; m.textContent = "답변을 입력해주세요."; return; }
      b.disabled = true;
      api("/api/partner/cs/" + a, {method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify(body)}).then(cs).catch(function(e){ if(e.message !== "auth"){ b.disabled = false; var m = M.querySelector('[data-cm="' + id + '"]'); m.className = "msg e"; m.textContent = e.message; cs.err = 1; } });
    }; });
  }).catch(function(e){ if(e.message !== "auth") M.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}

/* ---------- 정산 ---------- */
/* ---------- 부가세 신고용 매출 자료 ---------- */
function ym(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function csvTsv(t){ return String(t).replace(/^\ufeff/, "").split(/\r?\n/).filter(function(l){ return l.trim(); }).map(function(l){ var o = [], c = "", q = false, i; for(i = 0; i < l.length; i++){ var ch = l[i]; if(q){ if(ch === '"'){ if(l[i + 1] === '"'){ c += '"'; i++; } else q = false; } else c += ch; } else if(ch === '"') q = true; else if(ch === ","){ o.push(c); c = ""; } else c += ch; } o.push(c); return o.join("\t"); }).join("\n"); }
function csvBtns(id, url, name, label){
  return '<span class="f" style="margin:0;display:inline-flex"><button class="sv" data-dl="' + id + '">' + label + ' 엑셀 받기</button><button class="bt2" data-cp="' + id + '">복사</button></span><span class="msg" data-dm="' + id + '"></span>';
}
function csvBind(root, map){
  var say = function(id, t, bad){ var m = root.querySelector('[data-dm="' + id + '"]'); if(m){ m.className = "msg " + (bad ? "e" : "o"); m.textContent = t; } };
  var get = function(u){ return fetch(u, {credentials:"same-origin"}).then(function(r){ if(r.status === 401){ login(true); throw new Error("auth"); } if(!r.ok) throw new Error("자료를 만들지 못했어요"); return r.text(); }); };
  [].forEach.call(root.querySelectorAll("[data-dl]"), function(b){ b.onclick = function(){ var m = map[b.dataset.dl]; get(m.url).then(function(t){ var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["\ufeff" + t.replace(/^\ufeff/, "")], {type:"text/csv;charset=utf-8"})); a.download = m.name; document.body.appendChild(a); a.click(); a.remove(); say(b.dataset.dl, "내려받았어요. 받아지지 않으면 복사 버튼을 써주세요."); }).catch(function(e){ if(e.message !== "auth") say(b.dataset.dl, e.message, 1); }); }; });
  [].forEach.call(root.querySelectorAll("[data-cp]"), function(b){ b.onclick = function(){ var m = map[b.dataset.cp]; get(m.url).then(function(t){ var tsv = csvTsv(t); try{ navigator.clipboard.writeText(tsv).then(function(){ say(b.dataset.cp, "복사했어요. 엑셀에 붙여넣기 하세요."); }, function(){ say(b.dataset.cp, "복사가 막혀 있어요. 엑셀 받기를 써주세요.", 1); }); }catch(x){ say(b.dataset.cp, "복사가 막혀 있어요. 엑셀 받기를 써주세요.", 1); } }).catch(function(e){ if(e.message !== "auth") say(b.dataset.cp, e.message, 1); }); }; });
}
var VF = "", VT = "", VM = "";
function vatCard(){
  var now = new Date(), a = new Date(now.getFullYear(), now.getMonth() - 2, 1);
  VF = VF || ym(a); VT = VT || ym(now);
  return '<div class="card" id="vat"><h2>부가세 신고용 매출 자료</h2><p class="sub">예정 신고 때 세무사님께 드릴 자료예요. 기간을 고르고 조회해서 화면을 캡처하고, 월별 내역 엑셀을 함께 보내세요. 결제 완료일 기준이고 환불은 환불한 달에서 빠져요. 금액은 부가세 포함이에요.</p>'
    + '<div class="f" style="margin:0 0 10px"><input type="month" id="vf" value="' + VF + '" style="flex:none;min-width:150px"><span style="align-self:center">~</span><input type="month" id="vt" value="' + VT + '" style="flex:none;min-width:150px"><button class="sv" id="vs">조회</button><button class="bt2" id="vr">초기화</button></div><div class="s">최대 12개월까지 조회할 수 있어요.</div><div id="vres"></div></div>';
}
function vatBind(){
  var q = function(i){ return document.getElementById(i); }, res = q("vres");
  q("vr").onclick = function(){ VF = VT = VM = ""; settle(); };
  q("vs").onclick = function(){ VF = q("vf").value; VT = q("vt").value; VM = ""; run(); };
  function run(){
    res.innerHTML = '<div class="s" style="margin-top:12px">조회 중...</div>';
    api("/api/partner/vat?from=" + VF + "&to=" + VT).then(function(j){
      var row = function(r, t){ return '<tr' + (t ? ' class="tot"' : '') + '><td>' + (t ? "합계" : '<a class="ml" data-m="' + r.month + '">' + r.month.replace("-", ".") + '</a>') + '</td><td class="r">' + n(r.orders) + '</td><td class="r">' + n(r.net) + '</td><td class="r">' + n(r.exempt) + '</td><td class="r">' + n(r.card) + '</td><td class="r">' + n(r.other) + '</td><td class="r">' + n(r.supply) + '</td><td class="r">' + n(r.vat) + '</td><td class="r">' + n(r.refund) + '</td></tr>'; };
      res.innerHTML = '<div class="s" style="margin:12px 0 6px"><b>' + VF.replace("-", ".") + ' ~ ' + VT.replace("-", ".") + '</b> 조회 결과 · ' + esc(j.basis) + '</div><div class="h" style="margin:8px 0"><b>월별 내역</b>' + csvBtns("m", "", "", "월별내역") + '</div><div class="tw"><table class="tbl"><tr><th>부가세 신고기간</th><th class="r">주문</th><th class="r">과세매출액</th><th class="r">면세매출액</th><th class="r">카드·간편결제</th><th class="r">기타(계좌이체 등)</th><th class="r">공급가액</th><th class="r">부가세</th><th class="r">환불(차감됨)</th></tr>' + row(j.total, 1) + j.rows.map(function(r){ return row(r); }).join("") + '</table></div><p class="s" style="margin:6px 0 0">신고기간을 누르면 아래에 월간 상세 내역이 나와요.</p><div id="vdet"></div>';
      csvBind(res, {m:{url:"/api/partner/vat.csv?from=" + VF + "&to=" + VT, name:"vat-monthly-" + VF + "_" + VT + ".csv"}});
      [].forEach.call(res.querySelectorAll("[data-m]"), function(a){ a.onclick = function(){ VM = a.dataset.m; detail(); }; });
      if(VM) detail();
    }).catch(function(e){ if(e.message !== "auth") res.innerHTML = '<div class="msg e">' + esc(e.message) + '</div>'; });
  }
  function detail(){
    var d = q("vdet"); d.innerHTML = '<div class="s" style="margin-top:12px">불러오는 중...</div>';
    api("/api/partner/vat-days?month=" + VM).then(function(j){
      d.innerHTML = '<div class="h" style="margin:14px 0 8px"><b>월간 상세 내역 · ' + VM.replace("-", ".") + '</b><span>' + csvBtns("d", "", "", "일별내역") + ' ' + csvBtns("o", "", "", "건별내역") + '</span></div>' + (j.days.length ? '<div class="tw"><table class="tbl"><tr><th>일자</th><th class="r">주문</th><th class="r">과세매출액</th><th class="r">카드·간편결제</th><th class="r">기타</th><th class="r">공급가액</th><th class="r">부가세</th><th class="r">환불</th></tr>' + j.days.map(function(r){ return '<tr><td>' + r.day + '</td><td class="r">' + n(r.orders) + '</td><td class="r">' + n(r.net) + '</td><td class="r">' + n(r.card) + '</td><td class="r">' + n(r.other) + '</td><td class="r">' + n(r.supply) + '</td><td class="r">' + n(r.vat) + '</td><td class="r">' + n(r.refund) + '</td></tr>'; }).join("") + '</table></div>' : '<div class="empty">이 달 매출 내역이 없어요.</div>');
      csvBind(d, {d:{url:"/api/partner/vat-days.csv?month=" + VM, name:"vat-daily-" + VM + ".csv"}, o:{url:"/api/partner/vat-orders.csv?month=" + VM, name:"vat-orders-" + VM + ".csv"}});
    }).catch(function(e){ if(e.message !== "auth") d.innerHTML = '<div class="msg e">' + esc(e.message) + '</div>'; });
  }
  run();
}
function settle(){
  M.innerHTML = '<div class="empty">불러오는 중...</div>';
  api("/api/partner/settlements").then(function(j){
    M.innerHTML = vatCard() + '<div class="help">매월 정산이 확정되면 이메일로 정산서가 가고, 여기에서도 확인할 수 있어요. 환불된 금액은 정산에서 빠져요.</div>' + (j.settlements.length ? j.settlements.map(function(x){
      return '<div class="card"><div class="h"><h2>' + esc(x.month) + ' 정산</h2><span class="st ' + (x.paidAt ? "d" : "") + '">' + (x.paidAt ? "송금 완료 " + esc(kst(x.paidAt).slice(0, 10)) : "송금 예정") + '</span></div><div class="rw"><span>판매 금액 (' + x.n + '건)</span><b>' + n(x.sales) + '원</b></div>' + (x.refund ? '<div class="rw"><span>환불</span><b>-' + n(x.refund) + '원</b></div>' : '') + '<div class="rw"><span>수수료 (' + x.feeRate + '%)</span><b>-' + n(x.fee) + '원</b></div><div class="rw"><span><b>지급액</b></span><b>' + n(x.payout) + '원</b></div></div>';
    }).join("") : '<div class="empty">아직 확정된 정산이 없어요.</div>'); vatBind();
  }).catch(function(e){ if(e.message !== "auth") M.innerHTML = '<div class="empty">' + esc(e.message) + '</div>'; });
}
if(/^#(home|orders|stock|review|cs|settle)$/.test(location.hash)) TAB = location.hash.slice(1);
boot();
</script></body></html>
